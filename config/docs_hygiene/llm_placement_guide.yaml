version: 1

docs_root: docs

canonical_doc_roots:
  tutorial: docs/01-tutorials/
  how-to: docs/02-how-to/
  reference: docs/03-reference/
  explanation: docs/04-explanation/
  audit-report: docs/05-audit-reports/
  research: docs/06-research/
  adr: docs/90-adr/
  rfc: docs/91-rfc/
  runbook: docs/92-runbooks/
  architecture: docs/94-architecture/
  archive: docs/archive/

topic_routes:
  arbitration: docs/03-reference/governance/arbitration/
  flight_deck: docs/03-reference/governance/flight-deck/
  governance: docs/03-reference/governance/
  policy: docs/03-reference/governance/policy/
  learning: docs/03-reference/governance/learning/
  pr_merge: docs/03-reference/pr-pipeline/merge/
  pr_prep: docs/03-reference/pr-pipeline/prep/
  pr_template: docs/03-reference/pr-pipeline/templates/
  systems: docs/03-reference/systems/{name}/
  planes: docs/03-reference/planes/{name}/
  skills: docs/03-reference/skills/{name}/
  releases: docs/03-reference/releases/
  rollout: docs/02-how-to/rollout/
  ux: docs/03-reference/ux/
  mobile: docs/02-how-to/mobile/
  packaging: docs/02-how-to/packaging/
  integrations: docs/04-explanation/integrations/

required_frontmatter:
  base:
    required:
      - id
      - title
      - type
      - owner
      - author
      - date
      - last_review
      - next_review
      - prelude
    constraints:
      id: kebab-case
      prelude_max_tokens: 100
      date_format: YYYY-MM-DD
      owner_format: "@handle"
  by_type:
    adr:
      required:
        - status
        - graph_metadata
      allowed_status:
        - proposed
        - accepted
        - rejected
        - superseded
    rfc:
      required:
        - status
        - derived_from
      allowed_status:
        - draft
        - review
        - accepted
        - rejected
        - superseded
    runbook:
      required:
        - owner
        - last_review
        - next_review

forbidden_locations:
  - docs/
  - docs/arbitration/
  - docs/flight_deck/
  - docs/governance/
  - docs/integrations/
  - docs/learning/
  - docs/mobile/
  - docs/packaging/
  - docs/planes/
  - docs/policy/
  - docs/pr_merge/
  - docs/pr_prep/
  - docs/pr_template/
  - docs/releases/
  - docs/rollout/
  - docs/skills/
  - docs/spec/
  - docs/systems/
  - docs/ux/
patterns:
  disallowed_filename_patterns:
    - "*-2.md"
    - "*-3.md"
    - "* (1).md"
    - "*.bak"
  quarantined_prefixes:
    - docs/04-explanation/history/sourceFiles/

naming:
  filename_case: kebab-case
  allow_uppercase_only:
    - docs/00-MASTER-INDEX.md
    - docs/INDEX.md
  directory_limit:
    max_files: 200
  duplicate_suffix_policy: archive duplicate suffixed files under docs/archive/deduped-suffixes/

examples:
  tutorial:
    source_intent: first-time setup walkthrough
    destination: docs/01-tutorials/installing-dopemux.md
  how-to:
    source_intent: deploy or operate a workflow
    destination: docs/02-how-to/rollout/agent-enablement-guide.md
  reference:
    source_intent: stable contract, API, CLI, schema, or system reference
    destination: docs/03-reference/systems/dopetask/adapter-schema.md
  explanation:
    source_intent: why the system works this way or how components relate
    destination: docs/04-explanation/integrations/dope-memory-integration.md
  audit-report:
    source_intent: verification report or validation summary
    destination: docs/05-audit-reports/root-relocated/phase0-determinism-report.md
  research:
    source_intent: investigation or exploratory analysis
    destination: docs/06-research/investigations/context-retrieval-benchmark.md
  adr:
    source_intent: architecture decision record
    destination: docs/90-adr/adr-001-canonical-doc-placement.md
  rfc:
    source_intent: proposal under review
    destination: docs/91-rfc/rfc-001-docs-sweep-automation.md
  runbook:
    source_intent: operator recovery or maintenance procedure
    destination: docs/92-runbooks/rebuild-docs-index.md
