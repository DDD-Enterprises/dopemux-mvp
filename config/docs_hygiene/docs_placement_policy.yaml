# Files under docs/archive/ must have a row in this manifest (written by
# scripts/docs_archive_move.py). The archive is frozen: nothing is deleted,
# nothing is added by hand.
archive_manifest: docs/archive/MANIFEST.jsonl
archive_manifest_exempt:
  - docs/archive/MANIFEST.jsonl
  - docs/archive/overview.md

quarantine_prefixes:
  - docs/archive/w1-history-sourcefiles/

filename_exemptions:
  - docs/03-reference/dcp/**
  - docs/research/mcp-customization/**
  - docs/05-audit-reports/*
  - docs/03-reference/Dopemux Cockpit TUI Design System/*
  - docs/03-reference/gpt55_pm_implementer_redesign.md
  - docs/archive/*
  - docs/archive/w1-history-sourcefiles/*
  - docs/05-audit-reports/root-relocated/rgoutput-2.md
  - QUICK_START.md
  - task-packets/INDEX.md

keep_docs_root_files:
  - docs/00-MASTER-INDEX.md
  - docs/INDEX.md

unknown_top_level_fallback_dir: docs/04-explanation/root-relocated
default_root_target_dir: docs/04-explanation/root-relocated

relocation_rules:
