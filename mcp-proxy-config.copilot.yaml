# Generated from mcp_catalog.yaml by `dopemux mcp generate`. Do not hand-edit.
# Copilot proxy MCP servers — catalog entries whose `agents.copilot` row grants
# exposure (ADR-MCPINT-001 §2 / ADR-MCPINT-002; renderer: MCPINT-FND-CODEGEN-005).
# Deferred (planned-active, no endpoint yet — deployed by MCPINT-IMP-FACADE-001): dcp-readonly-facade
mcpServers:
  conport:
    type: sse
    url: http://localhost:${CONPORT_MCP_PORT:-3005}/sse
  dope-context:
    type: http
    url: http://localhost:3010/mcp
  dope-memory:
    type: http
    url: http://localhost:${DOPE_MEMORY_PORT:-3020}/mcp
  gpt-researcher:
    args:
    - exec
    - -i
    - dopemux-mcp-gptr-mcp
    - python
    - /app/server.py
    command: docker
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    type: stdio
  pal-stdio:
    args:
    - exec
    - -i
    - mcp-pal-stdio
    - /app/.venv/bin/python
    - server.py
    command: docker
    env:
      CHEAPERINFERENCE_API_KEY: ${CHEAPERINFERENCE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    type: stdio
  serena:
    type: http
    url: http://localhost:3006/mcp
  task-orchestrator:
    type: http
    url: http://127.0.0.1:${TASK_ORCHESTRATOR_HTTP_PORT:-7890}/mcp
