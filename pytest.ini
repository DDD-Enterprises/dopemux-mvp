[pytest]
minversion = 7.0
addopts =
    -ra
    # NOTE: deliberately no `-q` here. It used to be set, which meant the very
    # common `pytest -q` resolved to `-qq` and silently suppressed pytest's
    # final "N passed, M failed" summary line. Three separate agents auditing
    # this repo were unable to report test counts and had to hand-count the
    # progress-character stream; one could not produce a number at all. Losing
    # the count line degrades the primary signal used to verify a change, so
    # concise output is not worth it. Pass `-q` explicitly for quiet runs —
    # it now behaves normally and still prints the summary.
    --strict-markers
    --strict-config
testpaths = tests
pythonpath = src
asyncio_mode = auto
norecursedirs =
    .git
    .venv
    docker
    services
    installers
    scripts
    docs
    dashboard
    test_*.py.disabled
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    adhd: marks tests specific to ADHD features
    claude: marks tests specific to Claude Code integration
    database: marks tests that need a real database; skipped unless --run-database-tests is passed
    config: marks tests specific to configuration management
    asyncio: marks tests that rely on asyncio event loop
    database: marks tests that require database connection
    performance: marks performance-related tests
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
