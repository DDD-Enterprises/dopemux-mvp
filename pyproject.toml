[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dopemux"
version = "0.1.0"
description = "ADHD-optimized development platform that wraps Claude Code with custom configurations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Dopemux Team", email = "team@dopemux.dev"},
]
keywords = ["adhd", "development", "ai", "claude", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Tools",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "textual>=0.54.0",
    "readchar>=4.2.1",
    "requests>=2.28.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "aiohttp>=3.12.14",
    "watchdog>=3.0.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=3.30.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "toml>=0.10.0",
    "docker>=7.0.0",
    "litellm>=1.0.0",
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0.1",
    # Document processing dependencies
    "chardet>=5.0.0",
    "pymilvus>=2.3.0",
    "voyageai>=0.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "markdown>=3.4.0",
    "python-docx>=0.8.11",
    "pdfplumber>=0.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    "semgrep>=1.90.0",
    "dopetask==0.5.1",
]
services = [
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python==0.23.0",
    "tree-sitter-javascript==0.23.0",
    "tree-sitter-typescript==0.23.0",
    "tree-sitter-go==0.23.0",
    "tree-sitter-rust==0.23.0",
    "fastmcp",
    "httpx>=0.28.1",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "mcp>=1.0.0",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "passlib[bcrypt]>=1.7.4",
    "celery[redis]>=5.3.0",
    "kombu>=5.3.0",
    "qdrant-client>=1.15.0",
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "rank_bm25",
    "python-multipart>=0.0.12",
    "aioredis>=2.0.1",
    "asyncio-mqtt>=0.16.0",
    "aiofiles>=23.2.1",
    "psycopg2-binary>=2.9.7",
    "alembic>=1.12.0",
    "pytz>=2023.3",
    "orjson>=3.9.0",
    "msgpack>=1.0.7",
    "anthropic>=0.18.0",
]
all = [
    "dopemux[dev,services]",
]

[project.urls]
Homepage = "https://github.com/dopemux/dopemux-mvp"
Repository = "https://github.com/dopemux/dopemux-mvp"
Issues = "https://github.com/dopemux/dopemux-mvp/issues"
Documentation = "https://docs.dopemux.dev"

[project.scripts]
dopemux = "dopemux.cli:main"
dopemux-mobile = "dopemux.mobile.main:main"
dopemux-github = "dopemux_github_specialist.cli:main"
dopemux-pr-merge = "dopemux_pr_merge_specialist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["dopemux"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
