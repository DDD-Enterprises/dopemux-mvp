name: dopemux-adhd-mvp

services:
  postgres:
    image: apache/age:release_PG16_1.6.0
    environment:
      POSTGRES_USER: dopemux_age
      POSTGRES_PASSWORD: dopemux-age-local-2026
      POSTGRES_DB: dopemux_knowledge_graph
    ports:
      - "5432:5432"
    volumes:
      - adhd_pg_age_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-age.sql:/docker-entrypoint-initdb.d/01-init-age.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopemux_age -d dopemux_knowledge_graph || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  dopecon-bridge:
    build:
      context: ./services/dopecon-bridge
      dockerfile: Dockerfile
    environment:
      PORT: 3016
      PORT_BASE: 3000
      SECRET_KEY: dopemux-bridge-secret-local-2026
      DOPECON_BRIDGE_ADMIN_USERNAME: dopemux-dev-admin
      DOPECON_BRIDGE_ADMIN_PASSWORD: dopemux-bridge-local-2026
      POSTGRES_URL: postgresql+asyncpg://dopemux_age:dopemux-age-local-2026@postgres:5432/dopemux_knowledge_graph
      REDIS_URL: redis://redis:6379
      CONPORT_URL: http://conport:3004
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8097
    ports:
      - "3016:3016"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3016/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  conport:
    build:
      context: ./docker/mcp-servers-source/conport
      dockerfile: Dockerfile
    environment:
      MCP_SERVER_PORT: 3004
      DOPECON_BRIDGE_URL: http://dopecon-bridge:3016
      DATABASE_URL: postgresql://dopemux_age:dopemux-age-local-2026@postgres:5432/dopemux_knowledge_graph
      POSTGRES_URL: postgresql+asyncpg://dopemux_age:dopemux-age-local-2026@postgres:5432/dopemux_knowledge_graph
      AGE_HOST: postgres
      AGE_PORT: 5432
      AGE_PASSWORD: dopemux-age-local-2026
      REDIS_URL: redis://redis:6379
    ports:
      - "3004:3004"
      - "3005:3005"
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dopecon-bridge:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  adhd-engine:
    build:
      context: .
      dockerfile: services/adhd_engine/Dockerfile
    environment:
      API_PORT: 8095
      HOST: 0.0.0.0
      ADHD_ENGINE_API_KEY: dopemux-adhd-engine-local-2026
      REDIS_URL: redis://redis:6379
      CONPORT_URL: http://conport:3005
      DOPECON_BRIDGE_URL: http://dopecon-bridge:3016
      DOPECON_BRIDGE_SOURCE_PLANE: cognitive_plane
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8097,http://adhd-dashboard:8097
    ports:
      - "8095:8095"
    depends_on:
      redis:
        condition: service_healthy
      conport:
        condition: service_healthy
      dopecon-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8095/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  activity-capture:
    build:
      context: ./services/activity-capture
      dockerfile: Dockerfile
    environment:
      API_PORT: 8096
      ADHD_ENGINE_URL: http://adhd-engine:8095
      ADHD_ENGINE_API_KEY: dopemux-adhd-engine-local-2026
      ADHD_USER_ID: default
      REDIS_URL: redis://redis:6379
      STREAM_NAME: dopemux:events
      CONSUMER_GROUP: activity-capture
      CONSUMER_NAME: activity-capture-1
      ALLOWED_ORIGINS: http://localhost:8097,http://localhost:5173
    ports:
      - "8096:8096"
    depends_on:
      redis:
        condition: service_healthy
      adhd-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  adhd-dashboard:
    build:
      context: ./services/adhd-dashboard
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      ADHD_ENGINE_URL: http://adhd-engine:8095
      ACTIVITY_CAPTURE_URL: http://activity-capture:8096
      ADHD_ENGINE_API_KEY: dopemux-adhd-engine-local-2026
      DASHBOARD_USER_ID: default
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8097
    ports:
      - "8097:8097"
    depends_on:
      redis:
        condition: service_healthy
      adhd-engine:
        condition: service_healthy
      activity-capture:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  workspace-watcher:
    build:
      context: .
      dockerfile: services/workspace-watcher/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      WORKSPACE_WATCHER_ACTIVE_APP: Claude Code
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/Users/hue/code/dopemux-mvp

volumes:
  adhd_pg_age_data:
