# Dopemux cockpit font build plans.
#
# Two families:
#   - Dopemux Term   (spacing = term)                canonical operator mono / TUI
#   - Dopemux Editor (spacing = quasi-proportional)  prose-set companion (--font-editor)
#
# Faces per family: Regular + Medium, each Upright / Italic / Oblique (normal width).
# A real Medium weight is shipped so cockpit "bold" is never synthesized.
#
# Ambiguity-reduction character variants (cv__ / ss__ keys) should be exported from
# the Iosevka Customizer into the `variants.design` sections rather than guessed by
# hand. Slab is intentionally excluded.
#
# Build with build-dopemux-fonts.sh, then patch with patch-nerd-font.sh. See build.md.

[buildPlans.IosevkaDopemuxTerm]
family = "Dopemux Term"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

# Customizer-exported ambiguity-reduction variants belong here.
[buildPlans.IosevkaDopemuxTerm.variants.design]

[buildPlans.IosevkaDopemuxTerm.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaDopemuxTerm.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaDopemuxTerm.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaDopemuxTerm.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaDopemuxTerm.slopes.Oblique]
angle = 9.4
shape = "oblique"
menu = "oblique"
css = "oblique"

[buildPlans.IosevkaDopemuxTerm.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaDopemuxEditor]
family = "Dopemux Editor"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

# Customizer-exported ambiguity-reduction variants belong here.
[buildPlans.IosevkaDopemuxEditor.variants.design]

[buildPlans.IosevkaDopemuxEditor.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaDopemuxEditor.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaDopemuxEditor.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaDopemuxEditor.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaDopemuxEditor.slopes.Oblique]
angle = 9.4
shape = "oblique"
menu = "oblique"
css = "oblique"

[buildPlans.IosevkaDopemuxEditor.widths.Normal]
shape = 500
menu = 5
css = "normal"
