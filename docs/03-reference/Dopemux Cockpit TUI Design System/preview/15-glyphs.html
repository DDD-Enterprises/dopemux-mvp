<!doctype html>
<html><head><meta charset="utf-8"><title>Glyphs</title>
<link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="label">Glyphs · Nerd Font · ASCII fallback in NO_COLOR</div>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:13px;">
    <div class="pane"><span class="mint">SUCCESS</span>   <span class="dim">→</span> <span class="mono">✓</span></div>
    <div class="pane"><span class="pink">ERROR</span>     <span class="dim">→</span> <span class="mono">✗</span></div>
    <div class="pane"><span class="gold">WARNING</span>   <span class="dim">→</span> <span class="mono">!</span></div>
    <div class="pane"><span class="cyan">INFO</span>      <span class="dim">→</span> <span class="mono">i</span></div>
    <div class="pane"><span class="cyan">RUNNING</span>   <span class="dim">→</span> <span class="mono">▶</span></div>
    <div class="pane"><span class="dim">PENDING</span>   <span class="dim">→</span> <span class="mono">~</span></div>
    <div class="pane"><span class="pink">BLOCKED</span>   <span class="dim">→</span> <span class="mono">#</span></div>
    <div class="pane"><span class="muted">SKIPPED</span>   <span class="dim">→</span> <span class="mono">-</span></div>
    <div class="pane"><span class="cyan">PROMPT</span>    <span class="dim">→</span> <span class="mono">❯</span> / <span class="mono">&gt;</span></div>
    <div class="pane"><span class="cyan">ARROW_R</span>   <span class="dim">→</span> <span class="mono">&gt;</span></div>
</div>
<div class="label" style="margin-top:12px;">Brand mark</div>
<div class="pane" style="font-size:18px; text-align:center;"><span class="cyan">━━━◆ Ø ◆━━━</span></div>
<div class="note" style="margin-top:10px;">
No emoji. Forbidden arrows: <span class="mono">→ ⇒ ➜</span>. Use <span class="mono">-&gt;</span> when directionality is needed.
</div>
</body></html>
