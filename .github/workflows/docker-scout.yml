name: 🔍 Docker Scout (Vulnerability Analysis)

# Scans built GHCR images for CVEs, compares PR vs main, and surfaces
# base image recommendations.
# Docs: https://docs.docker.com/scout/integrations/ci/gha/

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.frontend'
      - 'services/**/Dockerfile*'
      - 'docker/**/Dockerfile*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.frontend'
      - 'services/**/Dockerfile*'
      - 'docker/**/Dockerfile*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: ghcr.io/ddd-enterprises/dopemux-mvp

jobs:
  scout:
    name: "🔍 Scout — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      pull-requests: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dopemux-backend
          - service: dopemux-frontend
          - service: conport
          - service: task-orchestrator
          - service: dopecon-bridge

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub (required for Scout API)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_SCOUT_HUB_USER }}
          password: ${{ secrets.DOCKER_SCOUT_HUB_PASSWORD }}

      # Compute the image ref we want to scan. On a PR we use the head SHA
      # (short); on a main push we use 'latest'.
      - name: 🏷️ Compute image ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            echo "image=${{ env.NAMESPACE }}/${{ matrix.service }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "to=${{ env.NAMESPACE }}/${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.NAMESPACE }}/${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"
            echo "to=" >> "$GITHUB_OUTPUT"
          fi

      # ── CVE Report ─────────────────────────────────────────────────────────
      - name: 🔍 Scout CVE Report
        id: scout-cves
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.ref.outputs.image }}
          # Fail CI on CRITICAL vulnerabilities
          exit-code: true
          exit-on: critical
          summary: true
          sarif-file: scout-${{ matrix.service }}.sarif

      # ── PR Comparison: PR image vs main `latest` ────────────────────────────
      - name: 📊 Scout Compare (PR vs main)
        if: github.event_name == 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ steps.ref.outputs.image }}
          to: ${{ steps.ref.outputs.to }}
          # Post results as a PR comment (requires pull-requests: write)
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary: true
          exit-code: false

      # ── Base Image Recommendations ──────────────────────────────────────────
      - name: 💡 Scout Recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: ${{ steps.ref.outputs.image }}
          summary: true
          exit-code: false

      # ── Upload SARIF → GitHub Security tab ─────────────────────────────────
      - name: 📤 Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-${{ matrix.service }}.sarif
          category: docker-scout-${{ matrix.service }}

      - name: 📊 Step Summary
        if: always()
        run: |
          echo "## 🔍 Scout — ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Scanned | \`${{ steps.ref.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVE report | Uploaded to Security tab |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "| Comparison | vs \`${{ steps.ref.outputs.to }}\` posted as PR comment |" >> $GITHUB_STEP_SUMMARY
          fi
