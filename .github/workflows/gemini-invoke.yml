name: '▶️ Gemini Invoke'

on:
  workflow_call:
    inputs:
      target_repository:
        type: 'string'
        description: 'Validated repository identity'
        required: true
      target_type:
        type: 'string'
        description: 'Validated target type'
        required: true
      target_number:
        type: 'string'
        description: 'Validated issue or pull request number'
        required: true
      target_head_sha:
        type: 'string'
        description: 'Validated PR head SHA; empty for issue targets'
        required: false
        default: ''
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-invoke-${{ inputs.target_repository }}-${{ inputs.target_type }}-${{ inputs.target_number }}-${{ inputs.target_head_sha }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    runs-on: 'ubuntu-latest'
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Validate exact target'
        id: 'validate_target'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        env:
          TARGET_REPOSITORY: '${{ inputs.target_repository }}'
          TARGET_TYPE: '${{ inputs.target_type }}'
          TARGET_NUMBER: '${{ inputs.target_number }}'
          TARGET_HEAD_SHA: '${{ inputs.target_head_sha }}'
          ALLOWED_TARGET_TYPES: 'pull_request,issue'
        with:
          script: |-
            const liveRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (process.env.TARGET_REPOSITORY !== liveRepository) {
              throw new Error('target_repository_mismatch');
            }
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (repository.data.full_name !== liveRepository) {
              throw new Error('live_repository_identity_mismatch');
            }
            const targetType = process.env.TARGET_TYPE;
            const allowedTypes = process.env.ALLOWED_TARGET_TYPES.split(',');
            if (!allowedTypes.includes(targetType)) {
              throw new Error('target_type_invalid');
            }
            const targetNumberText = process.env.TARGET_NUMBER || '';
            if (!/^[1-9][0-9]*$/.test(targetNumberText)) {
              throw new Error('target_number_invalid');
            }
            const targetNumber = Number(targetNumberText);
            if (!Number.isSafeInteger(targetNumber)) {
              throw new Error('target_number_invalid');
            }
            const requestedHead = process.env.TARGET_HEAD_SHA || '';
            let target;
            let liveHead = '';
            if (targetType === 'pull_request') {
              if (!/^[0-9a-f]{40}$/.test(requestedHead)) {
                throw new Error('target_head_sha_invalid');
              }
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: targetNumber,
              });
              target = pull.data;
              liveHead = target.head.sha;
              if (target.state !== 'open' || liveHead !== requestedHead) {
                throw new Error('target_head_sha_mismatch');
              }
            } else {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNumber,
              });
              target = issue.data;
              if (requestedHead || target.pull_request || target.state !== 'open') {
                throw new Error('target_issue_invalid');
              }
            }
            core.setOutput('target_repository', liveRepository);
            core.setOutput('target_type', targetType);
            core.setOutput('target_number', String(targetNumber));
            core.setOutput('target_head_sha', liveHead);
            core.setOutput('target_title', target.title || '');
            core.setOutput('target_body', target.body || '');

      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' # ratchet:actions/create-github-app-token@v3
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'read'
          permission-pull-requests: 'read'

      - name: 'Checkout Code'
        uses: 'actions/checkout@v4' # ratchet:exclude
        with:
          ref: '${{ inputs.target_type == ''pull_request'' && inputs.target_head_sha || github.sha }}'
          persist-credentials: false

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          TITLE: '${{ steps.validate_target.outputs.target_title }}'
          DESCRIPTION: '${{ steps.validate_target.outputs.target_body }}'
          EVENT_NAME: '${{ steps.validate_target.outputs.target_type }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          IS_PULL_REQUEST: '${{ steps.validate_target.outputs.target_type == ''pull_request'' }}'
          ISSUE_NUMBER: '${{ steps.validate_target.outputs.target_number }}'
          REPOSITORY: '${{ steps.validate_target.outputs.target_repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-invoke'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: '/gemini-invoke'
