name: '🔀 Gemini Triage'

on:
  workflow_call:
    inputs:
      target_repository:
        type: 'string'
        description: 'Validated repository identity'
        required: true
      target_type:
        type: 'string'
        description: 'Validated target type'
        required: true
      target_number:
        type: 'string'
        description: 'Validated issue number'
        required: true
      target_head_sha:
        type: 'string'
        description: 'Must be empty for issue targets'
        required: false
        default: ''
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-triage-${{ inputs.target_repository }}-${{ inputs.target_number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      selected_labels: '${{ env.SELECTED_LABELS }}'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Validate exact target'
        id: 'validate_target'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        env:
          TARGET_REPOSITORY: '${{ inputs.target_repository }}'
          TARGET_TYPE: '${{ inputs.target_type }}'
          TARGET_NUMBER: '${{ inputs.target_number }}'
          TARGET_HEAD_SHA: '${{ inputs.target_head_sha }}'
          ALLOWED_TARGET_TYPES: 'issue'
        with:
          script: |-
            const liveRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (process.env.TARGET_REPOSITORY !== liveRepository) {
              throw new Error('target_repository_mismatch');
            }
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (repository.data.full_name !== liveRepository) {
              throw new Error('live_repository_identity_mismatch');
            }
            const targetType = process.env.TARGET_TYPE;
            const allowedTypes = process.env.ALLOWED_TARGET_TYPES.split(',');
            if (!allowedTypes.includes(targetType)) {
              throw new Error('target_type_invalid');
            }
            const targetNumberText = process.env.TARGET_NUMBER || '';
            if (!/^[1-9][0-9]*$/.test(targetNumberText)) {
              throw new Error('target_number_invalid');
            }
            const targetNumber = Number(targetNumberText);
            if (!Number.isSafeInteger(targetNumber)) {
              throw new Error('target_number_invalid');
            }
            const requestedHead = process.env.TARGET_HEAD_SHA || '';
            let target;
            let liveHead = '';
            if (targetType === 'pull_request') {
              if (!/^[0-9a-f]{40}$/.test(requestedHead)) {
                throw new Error('target_head_sha_invalid');
              }
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: targetNumber,
              });
              target = pull.data;
              liveHead = target.head.sha;
              if (target.state !== 'open' || liveHead !== requestedHead) {
                throw new Error('target_head_sha_mismatch');
              }
            } else {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNumber,
              });
              target = issue.data;
              if (requestedHead || target.pull_request || target.state !== 'open') {
                throw new Error('target_issue_invalid');
              }
            }
            core.setOutput('target_repository', liveRepository);
            core.setOutput('target_type', targetType);
            core.setOutput('target_number', String(targetNumber));
            core.setOutput('target_head_sha', liveHead);
            core.setOutput('target_title', target.title || '');
            core.setOutput('target_body', target.body || '');

      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        with:
          # NOTE: we intentionally do not use the given token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: 'Run Gemini issue analysis'
        id: 'gemini_analysis'
        if: |-
          ${{ steps.get_labels.outputs.available_labels != '' }}
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          GITHUB_TOKEN: '' # Do NOT pass any auth tokens here since this runs on untrusted inputs
          ISSUE_TITLE: '${{ steps.validate_target.outputs.target_title }}'
          ISSUE_BODY: '${{ steps.validate_target.outputs.target_body }}'
          ISSUE_NUMBER: '${{ steps.validate_target.outputs.target_number }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-triage'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "run_shell_command(echo)"
                ]
              }
            }
          prompt: '/gemini-triage'

  label:
    runs-on: 'ubuntu-latest'
    needs:
      - 'triage'
    if: |-
      ${{ needs.triage.outputs.selected_labels != '' }}
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' # ratchet:actions/create-github-app-token@v3
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply labels'
        env:
          ISSUE_NUMBER: '${{ inputs.target_number }}'
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          SELECTED_LABELS: '${{ needs.triage.outputs.selected_labels }}'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        with:
          # Use the provided token so that the "gemini-cli" is the actor in the
          # log for what changed the labels.
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort()

            // Parse the label as a CSV, reject invalid ones - we do this just
            // in case someone was able to prompt inject malicious labels.
            const selectedLabels = (process.env.SELECTED_LABELS || '').split(',')
              .map((label) => label.trim())
              .filter((label) => availableLabels.includes(label))
              .sort()

            // Set the labels
            const issueNumber = process.env.ISSUE_NUMBER;
            if (selectedLabels && selectedLabels.length > 0) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: selectedLabels,
              });
              core.info(`Successfully set labels: ${selectedLabels.join(',')}`);
            } else {
              core.info(`Failed to determine labels to set. There may not be enough information in the issue or pull request.`)
            }
