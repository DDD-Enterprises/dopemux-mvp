name: embedded-audit

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: string
      head_sha:
        description: Expected pull request head SHA
        required: true
        type: string
      allow_api_spend:
        description: "Execution mechanism only; requires separate explicit operator spend authorization."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  embedded-audit:
    name: independent embedded audit
    runs-on: ubuntu-latest
    steps:
      - name: Set PR metadata
        id: pr
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          TRUSTED_FALLBACK_REF: ${{ github.event.repository.default_branch }}
        run: |
          test -n "$INPUT_PR_NUMBER"
          test -n "$INPUT_HEAD_SHA"
          test -n "$TRUSTED_FALLBACK_REF"
          printf 'number=%s\n' "$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$INPUT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'trusted_ref=%s\n' "$TRUSTED_FALLBACK_REF" >> "$GITHUB_OUTPUT"

      - name: Review settlement preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MIN_READY_AGE_SECONDS: "300"
          MIN_ACTIVITY_QUIET_SECONDS: "120"
          REVIEW_SETTLEMENT_JSON: /tmp/review-settlement.json
        run: |
          set -euo pipefail
          owner="${EXPECTED_REPO%%/*}"
          name="${EXPECTED_REPO#*/}"
          test -n "$owner"
          test -n "$name"
          test "$owner/$name" = "$EXPECTED_REPO"
          printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'

          gh api graphql \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){number state isDraft merged createdAt headRefOid reviewDecision readyForReviewEvents:timelineItems(last:100,itemTypes:[READY_FOR_REVIEW_EVENT]){pageInfo{hasPreviousPage}nodes{... on ReadyForReviewEvent{createdAt}}}reviews(last:100){pageInfo{hasPreviousPage}nodes{author{login}submittedAt updatedAt state}}reviewThreads(first:100){pageInfo{hasNextPage}nodes{isResolved comments(last:100){pageInfo{hasPreviousPage}nodes{createdAt updatedAt}}}}}}}' \
            > "$REVIEW_SETTLEMENT_JSON"

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path


          def parse_time(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))


          payload = json.loads(
              Path(os.environ["REVIEW_SETTLEMENT_JSON"]).read_text(encoding="utf-8")
          )
          errors = payload.get("errors") or []
          repo = (payload.get("data") or {}).get("repository")
          pr = (repo or {}).get("pullRequest")
          reasons = []

          if errors:
              reasons.append("graphql_errors")
          if not isinstance(pr, dict):
              reasons.append("pull_request_missing")
              pr = {}

          expected_pr = int(os.environ["PR_NUMBER"])
          expected_head = os.environ["EXPECTED_HEAD_SHA"]
          if pr.get("number") != expected_pr:
              reasons.append("pr_number_mismatch")
          if pr.get("headRefOid") != expected_head:
              reasons.append("head_sha_mismatch")
          if pr.get("state") != "OPEN":
              reasons.append("pr_not_open")
          if pr.get("isDraft") is not False:
              reasons.append("pr_is_draft_or_unknown")
          if pr.get("merged") is not False:
              reasons.append("pr_merged_or_unknown")
          if pr.get("reviewDecision") == "CHANGES_REQUESTED":
              reasons.append("active_change_request_reviews")

          ready_events = pr.get("readyForReviewEvents") or {}
          reviews = pr.get("reviews") or {}
          threads = pr.get("reviewThreads") or {}
          if (ready_events.get("pageInfo") or {}).get("hasPreviousPage") is not False:
              reasons.append("ready_events_pagination_unknown")
          if (reviews.get("pageInfo") or {}).get("hasPreviousPage") is not False:
              reasons.append("reviews_pagination_unknown")
          if (threads.get("pageInfo") or {}).get("hasNextPage") is not False:
              reasons.append("review_threads_pagination_unknown")

          now_value = os.environ.get("NOW_ISO")
          now = parse_time(now_value) if now_value else datetime.now(timezone.utc)
          ready_times = []
          for node in ready_events.get("nodes") or []:
              created_at = (node or {}).get("createdAt")
              if not created_at:
                  reasons.append("ready_event_timestamp_missing")
              else:
                  ready_times.append(parse_time(created_at))
          ready_age = None
          if not ready_times:
              created_at = pr.get("createdAt")
              if not created_at:
                  reasons.append("ready_for_review_event_missing")
              else:
                  ready_times.append(parse_time(created_at))
          if ready_times:
              ready_age = int((now - max(ready_times)).total_seconds())
              if ready_age < int(os.environ["MIN_READY_AGE_SECONDS"]):
                  reasons.append("ready_for_review_too_recent")

          unresolved = 0
          activity_times = []
          latest_review_state_by_author = {}
          for review in reviews.get("nodes") or []:
              author = ((review or {}).get("author") or {}).get("login")
              if author:
                  previous = latest_review_state_by_author.get(author)
                  review_time = None
                  for field in ("updatedAt", "submittedAt"):
                      value = (review or {}).get(field)
                      if value:
                          review_time = parse_time(value)
                          break
                  if review_time and (
                      previous is None or review_time >= previous["time"]
                  ):
                      latest_review_state_by_author[author] = {
                          "state": (review or {}).get("state"),
                          "time": review_time,
                      }
              for field in ("submittedAt", "updatedAt"):
                  value = (review or {}).get(field)
                  if value:
                      activity_times.append(parse_time(value))
          if any(
              review["state"] == "CHANGES_REQUESTED"
              for review in latest_review_state_by_author.values()
          ):
              reasons.append("active_change_request_reviews")
          for thread in threads.get("nodes") or []:
              if (thread or {}).get("isResolved") is not True:
                  unresolved += 1
              comments = (thread or {}).get("comments") or {}
              if (comments.get("pageInfo") or {}).get("hasPreviousPage") is not False:
                  reasons.append("review_comments_pagination_unknown")
              for comment in comments.get("nodes") or []:
                  for field in ("createdAt", "updatedAt"):
                      value = (comment or {}).get(field)
                      if value:
                          activity_times.append(parse_time(value))
          if unresolved:
              reasons.append("unresolved_review_threads")

          activity_age = None
          if activity_times:
              activity_age = int((now - max(activity_times)).total_seconds())
              if activity_age < int(os.environ["MIN_ACTIVITY_QUIET_SECONDS"]):
                  reasons.append("review_activity_too_recent")

          result = {
              "marker": "PRE_MODEL_REVIEW_GATE",
              "status": "PASS" if not reasons else "BLOCKED",
              "repo": os.environ["EXPECTED_REPO"],
              "pr_number": expected_pr,
              "expected_head_sha": expected_head,
              "live_head_sha": pr.get("headRefOid"),
              "ready_age_seconds": ready_age,
              "review_activity_age_seconds": activity_age,
              "unresolved_review_threads": unresolved,
              "reasons": sorted(set(reasons)),
          }
          rendered = json.dumps(result, sort_keys=True, separators=(",", ":"))
          print(rendered)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with Path(summary_path).open("a", encoding="utf-8") as summary:
                  summary.write(f"PRE_MODEL_REVIEW_GATE `{rendered}`\n")
          if reasons:
              raise SystemExit(1)
          PY

      - name: Checkout trusted audit source
        uses: actions/checkout@v4
        with:
          # Trusted base/default-branch code only. Candidate head is fetched as
          # data later and never checked out as the working tree.
          ref: ${{ steps.pr.outputs.trusted_ref }}
          fetch-depth: 2
          path: trusted-source
          persist-credentials: false

      - name: Verify trusted audit source
        env:
          EXPECTED_TRUSTED_REF: ${{ steps.pr.outputs.trusted_ref }}
        run: |
          actual_trusted_ref="$(git -C trusted-source rev-parse HEAD)"
          if printf '%s' "$EXPECTED_TRUSTED_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            test "$actual_trusted_ref" = "$EXPECTED_TRUSTED_REF"
          else
            test -n "$actual_trusted_ref"
          fi
          # Do not hard-fail here when run_embedded_audit.py is absent.
          # The emit step writes a schema-valid SKIPPED diagnostic PROOF so
          # artifact upload + Steward can still bind the head and overwrite a
          # prior green "PR Steward / final readiness" status with failure.

      - name: Verify requested head SHA
        id: head_integrity
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # Candidate material is fetched as objects only (no candidate checkout,
          # no candidate script execution, no credentials on candidate tree).
          if git -C trusted-source fetch --no-tags --depth=1 origin "$EXPECTED_HEAD_SHA"; then
            actual_head_sha="$(git -C trusted-source rev-parse FETCH_HEAD)"
          else
            actual_head_sha=""
          fi
          pr_head_sha="$(git -C trusted-source ls-remote origin "refs/pull/${PR_NUMBER}/head" | awk '{print $1}')"
          if [ "$actual_head_sha" = "$EXPECTED_HEAD_SHA" ] && [ "$pr_head_sha" = "$EXPECTED_HEAD_SHA" ]; then
            printf 'verified=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'verified=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Static auditor route preflight
        if: always() && steps.head_integrity.outputs.verified == 'true'
        working-directory: trusted-source
        run: |
          mkdir -p ../embedded-audit-artifacts
          set +e
          python -m tools.auditor_router.preflight \
            --packet-id "TP-DMX-AUDIT-CI-PROVENANCE-104" \
            --out ../embedded-audit-artifacts \
            --format json
          preflight_status=$?
          set -e
          if [ ! -f ../embedded-audit-artifacts/AUDITOR_ROUTE.json ]; then
            cat > ../embedded-audit-artifacts/AUDITOR_ROUTE.json <<'JSON'
          {
            "tool": "pal-mcp-clink",
            "underlying_cli": null,
            "clink_client_name": null,
            "audit_safe_config_proven": false,
            "clink_mutation_flags_detected": [],
            "invocation_template": null,
            "status": "NEEDS_SUPERVISOR",
            "reason": "Static auditor route preflight did not emit AUDITOR_ROUTE.json."
          }
          JSON
          fi

      - name: Setup trusted Claude audit runner
        if: always() && steps.head_integrity.outputs.verified == 'true' && inputs.allow_api_spend == true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install trusted Claude audit runner
        if: always() && steps.head_integrity.outputs.verified == 'true' && inputs.allow_api_spend == true
        run: npm install --global @anthropic-ai/claude-code@2.1.204

      - name: Run PAL clink audit
        # Soft exit is intentional: the runner may emit a machine-readable error
        # payload with exit 0 so later steps always emit a diagnostic proof and
        # the hard enforcement step remains the sole green/red authority.
        # Tests prove synthetic error results cannot pass enforcement.
        if: always() && steps.head_integrity.outputs.verified == 'true'
        id: runner
        working-directory: trusted-source
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          ALLOW_API_SPEND: ${{ inputs.allow_api_spend }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          head_sha='${{ steps.pr.outputs.head_sha }}'
          if ! git cat-file -e "${head_sha}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$head_sha"
          fi
          # Candidate material is text-only: name-status + unified diff objects.
          # Never checkout or execute candidate code. Prompt uses unique trusted
          # delimiters (not Markdown fencing alone) and repeats trusted instructions
          # after untrusted candidate content.
          mkdir -p ../embedded-audit-artifacts
          git diff --find-renames --name-status "$base_sha" "$head_sha" \
            > ../embedded-audit-artifacts/CANDIDATE_CHANGED_FILES.txt
          git diff --find-renames --no-ext-diff "$base_sha" "$head_sha" \
            > ../embedded-audit-artifacts/CANDIDATE_UNIFIED_DIFF.txt
          # Fail closed when the trusted prompt builder / instruction-like scanner
          # is unavailable: do NOT embed raw candidate text, do NOT invent a clean
          # scan (detected:false), and do NOT invoke the model auditor.
          PROMPT_BUILDER_AVAILABLE=false
          if [ -f scripts/audit/pal_clink_runner.py ]; then
            PROMPT_BUILDER_AVAILABLE=true
            python -m scripts.audit.pal_clink_runner \
              --build-prompt \
              --repo "$GITHUB_REPOSITORY" \
              --pr '${{ steps.pr.outputs.number }}' \
              --head-sha "$head_sha" \
              --base-sha "$base_sha" \
              --changed-files ../embedded-audit-artifacts/CANDIDATE_CHANGED_FILES.txt \
              --unified-diff ../embedded-audit-artifacts/CANDIDATE_UNIFIED_DIFF.txt \
              --prompt-out ../embedded-audit-artifacts/PAL_CLINK_AUDIT_INPUT.md \
              --instruction-like-out ../embedded-audit-artifacts/INSTRUCTION_LIKE_CONTENT.json
          else
            printf '%s\n' \
              "Trusted prompt builder and instruction-like scanner unavailable: scripts/audit/pal_clink_runner.py missing on trusted ref." \
              > ../embedded-audit-artifacts/PROMPT_BUILD_UNAVAILABLE.txt
            # No candidate-laden prompt, no false-clean INSTRUCTION_LIKE_CONTENT.json,
            # no PAL_CLINK_AUDIT_OUTPUT.json — emitter records schema-valid SKIPPED.
          fi
          set +e
          if [ "$PROMPT_BUILDER_AVAILABLE" != true ]; then
            status=127
          elif [ "$ALLOW_API_SPEND" != true ]; then
            printf '%s\n' '{"status":"error","risks":["Explicit operator API spend authority was not granted."]}' \
              > ../embedded-audit-artifacts/PAL_CLINK_AUDIT_OUTPUT.json
            status=78
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            printf '%s\n' '{"status":"error","risks":["Trusted Claude provider credential is unavailable."]}' \
              > ../embedded-audit-artifacts/PAL_CLINK_AUDIT_OUTPUT.json
            status=78
          else
            python -m scripts.audit.pal_clink_runner \
              --route-json ../embedded-audit-artifacts/AUDITOR_ROUTE.json \
              --prompt ../embedded-audit-artifacts/PAL_CLINK_AUDIT_INPUT.md \
              --pal-output-json ../embedded-audit-artifacts/PAL_CLINK_AUDIT_OUTPUT.json \
              --raw-output-json ../embedded-audit-artifacts/PAL_CLINK_AUDIT_RUNNER_OUTPUT.json
            status=$?
          fi
          # Only synthesize an error payload when the trusted builder was present but
          # the auditor invocation failed to emit output. Missing builder must remain
          # a non-executed SKIPPED path (no fabricated scan / no candidate-to-model).
          if [ "$PROMPT_BUILDER_AVAILABLE" = true ] && [ ! -f ../embedded-audit-artifacts/PAL_CLINK_AUDIT_OUTPUT.json ]; then
            printf '{"status":"error","risks":["PAL clink runner did not emit output; exit_code=%s"]}\n' "$status" \
              > ../embedded-audit-artifacts/PAL_CLINK_AUDIT_OUTPUT.json
          fi
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          # Soft exit: hard proof enforcement is authoritative (see step comments).
          exit 0

      - name: Install canonical schema validator
        # The acceptance gate validates the signed embedded_audit against the
        # trusted schema under real Draft 7 semantics and fails closed when the
        # engine is absent. jsonschema is a declared project dependency
        # (pyproject.toml); this job installs no project deps, so provision it
        # explicitly rather than rely on an undeclared runner-image package.
        if: always() && steps.head_integrity.outputs.verified == 'true'
        run: python -m pip install --quiet 'jsonschema>=4.20.0'

      - name: Evaluate local signed audit attestation
        if: always() && steps.head_integrity.outputs.verified == 'true'
        working-directory: trusted-source
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # Fail-closed fallback for runs where no auditor CLI/provider is
          # provisioned: accept a locally-executed audit ONLY when the PR head
          # carries proof/pr_merge/embedded-audit/pr-<N>/PROOF.json signed by a
          # key in the TRUSTED allowed-signers file, bound to this repo+PR, and
          # the audited commit differs from the head by proof-dir files alone.
          # Candidate PR code is read as git blobs only — never executed.
          # Soft exit: a rejected/absent attestation leaves today's
          # SKIPPED/red path unchanged; the emit + enforce steps stay the sole
          # green/red authority.
          set +e
          python -m scripts.audit.local_audit_acceptance \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --allowed-signers config/audit/embedded-audit-allowed-signers \
            --schema schemas/proof/embedded_audit.schema.json \
            --out ../embedded-audit-artifacts/LOCAL_AUDIT_ATTESTATION.json
          attestation_status=$?
          set -e
          echo "local attestation evaluation exit=${attestation_status}"
          exit 0

      - name: Emit independent embedded audit proof
        if: always() && steps.head_integrity.outputs.verified == 'true'
        working-directory: trusted-source
        env:
          EMBEDDED_AUDIT_TOKEN: ${{ secrets.EMBEDDED_AUDIT_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          mkdir -p ../embedded-audit-artifacts
          if [ ! -f scripts/audit/run_embedded_audit.py ]; then
            # Structured diagnostic only — schema-valid SKIPPED (none/unknown),
            # executed=false; no forged trusted provenance. Enforce still reds.
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          reason = (
              "Trusted audit emitter scripts/audit/run_embedded_audit.py "
              "is missing on the trusted ref."
          )
          out = Path("../embedded-audit-artifacts")
          out.mkdir(parents=True, exist_ok=True)
          report_path = "proof/TP-DMX-AUDIT-CI-PROVENANCE-104/AUDITOR_REPORT.md"
          proof = {
              "packet_id": "TP-DMX-AUDIT-CI-PROVENANCE-104",
              "repo": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "executed": False,
              "mutation_performed": False,
              "github_mutation_route_added": False,
              "embedded_audit": {
                  "required": True,
                  "status": "SKIPPED",
                  "auditor_tool": "none",
                  "auditor_model": "unknown",
                  "invocation": None,
                  "exit_code": None,
                  "report_path": report_path,
                  "findings": [],
                  "fixes_applied": [],
                  "remaining_risks": [reason],
                  "skip_reason": reason,
              },
          }
          (out / "PROOF.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (out / "AUDITOR_REPORT.md").write_text(
              f"# Embedded audit\n\nstatus: SKIPPED\n\nreason: {reason}\n",
              encoding="utf-8",
          )
          PY
            exit 0
          fi
          if [ -f ../embedded-audit-artifacts/PROMPT_BUILD_UNAVAILABLE.txt ]; then
            skip_reason="$(
              tr '\n' ' ' < ../embedded-audit-artifacts/PROMPT_BUILD_UNAVAILABLE.txt \
                | sed 's/[[:space:]]*$//'
            )"
            python scripts/audit/run_embedded_audit.py \
              --packet-id "TP-DMX-AUDIT-CI-PROVENANCE-104" \
              --repo "$GITHUB_REPOSITORY" \
              --pr "${PR_NUMBER}" \
              --head-sha "${HEAD_SHA}" \
              --route-json ../embedded-audit-artifacts/AUDITOR_ROUTE.json \
              --force-skip-reason "${skip_reason}" \
              --out ../embedded-audit-artifacts
          else
            python scripts/audit/run_embedded_audit.py \
              --packet-id "TP-DMX-AUDIT-CI-PROVENANCE-104" \
              --repo "$GITHUB_REPOSITORY" \
              --pr "${PR_NUMBER}" \
              --head-sha "${HEAD_SHA}" \
              --route-json ../embedded-audit-artifacts/AUDITOR_ROUTE.json \
              --pal-output-json ../embedded-audit-artifacts/PAL_CLINK_AUDIT_OUTPUT.json \
              --local-attestation-json ../embedded-audit-artifacts/LOCAL_AUDIT_ATTESTATION.json \
              --instruction-like-json ../embedded-audit-artifacts/INSTRUCTION_LIKE_CONTENT.json \
              --out ../embedded-audit-artifacts
          fi

      - name: Emit unavailable independent audit proof
        if: always() && steps.head_integrity.outputs.verified != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          mkdir -p embedded-audit-artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Inline diagnostic shape mirrors build_diagnostic_failure_proof:
          # executed=false, schema-valid SKIPPED (none/unknown), no trusted provenance.
          reason = "Requested PR head SHA could not be fetched or no longer matches the PR head."
          artifact_dir = Path("embedded-audit-artifacts")
          report_path = "proof/TP-DMX-AUDIT-CI-PROVENANCE-104/AUDITOR_REPORT.md"
          proof = {
              "packet_id": "TP-DMX-AUDIT-CI-PROVENANCE-104",
              "repo": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "executed": False,
              "mutation_performed": False,
              "github_mutation_route_added": False,
              "embedded_audit": {
                  "required": True,
                  "status": "SKIPPED",
                  "auditor_tool": "none",
                  "auditor_model": "unknown",
                  "invocation": None,
                  "exit_code": None,
                  "report_path": report_path,
                  "findings": [],
                  "fixes_applied": [],
                  "remaining_risks": [reason],
                  "skip_reason": reason,
              },
          }
          (artifact_dir / "PROOF.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (artifact_dir / "AUDITOR_REPORT.md").write_text(
              f"# Embedded audit\n\nstatus: SKIPPED\n\nreason: {reason}\n",
              encoding="utf-8",
          )
          PY

      - name: Enforce independent audit result
        if: always()
        env:
          EXPECTED_PR: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # Hard gate: status alone is never sufficient. Requires executed=true,
          # trusted provenance, matching PR/head, and PASS|PASS_WITH_RISKS.
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          proof_path = Path("embedded-audit-artifacts/PROOF.json")
          if not proof_path.is_file():
              # Schema-valid SKIPPED diagnostic; hard enforce still fails closed.
              fallback = Path("embedded-audit-artifacts")
              fallback.mkdir(parents=True, exist_ok=True)
              reason = "Independent audit proof is missing."
              report_path = "proof/TP-DMX-AUDIT-CI-PROVENANCE-104/AUDITOR_REPORT.md"
              proof = {
                  "packet_id": "TP-DMX-AUDIT-CI-PROVENANCE-104",
                  "executed": False,
                  "pr_number": int(os.environ.get("EXPECTED_PR") or 0),
                  "head_sha": os.environ.get("EXPECTED_HEAD_SHA") or "",
                  "repo": os.environ.get("GITHUB_REPOSITORY") or "",
                  "mutation_performed": False,
                  "github_mutation_route_added": False,
                  "embedded_audit": {
                      "required": True,
                      "status": "SKIPPED",
                      "auditor_tool": "none",
                      "auditor_model": "unknown",
                      "invocation": None,
                      "exit_code": None,
                      "report_path": report_path,
                      "findings": [],
                      "fixes_applied": [],
                      "remaining_risks": [reason],
                      "skip_reason": reason,
                  },
              }
              (fallback / "PROOF.json").write_text(
                  json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              raise SystemExit(reason)

          trusted_root = Path("trusted-source")
          if trusted_root.is_dir():
              sys.path.insert(0, str(trusted_root.resolve()))
          else:
              sys.path.insert(0, str(Path.cwd()))

          from scripts.audit.run_embedded_audit import enforce_independent_audit_proof

          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          enforce_independent_audit_proof(
              proof,
              expected_pr=int(os.environ["EXPECTED_PR"]),
              expected_head_sha=os.environ["EXPECTED_HEAD_SHA"],
              expected_repo=os.environ.get("GITHUB_REPOSITORY"),
          )
          PY

      - name: Write job summary
        if: always()
        run: |
          {
            printf '## Embedded audit\n\n'
            printf -- '- mutation_performed: false\n'
            printf -- '- proof_author: independent-embedded-audit (only when executed=true)\n'
            printf -- '- token_value_recorded: false\n'
            printf -- '- soft_runner_exit: intentional; hard enforcement is authoritative\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload embedded audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Collision-resistant identity: purpose + PR + exact head SHA.
          name: embedded-audit-pr-${{ steps.pr.outputs.number }}-head-${{ steps.pr.outputs.head_sha }}-proof
          path: embedded-audit-artifacts/
          if-no-files-found: error
