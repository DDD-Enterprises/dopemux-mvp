name: embedded-audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: string
      head_sha:
        description: Expected pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  embedded-audit:
    name: independent embedded audit
    runs-on: ubuntu-latest
    steps:
      - name: Set PR metadata
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          TRUSTED_DEFAULT_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr_number="$EVENT_PR_NUMBER"
            head_sha="$EVENT_HEAD_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr_number="$INPUT_PR_NUMBER"
            head_sha="$INPUT_HEAD_SHA"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          printf '%s' "$pr_number" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$TRUSTED_DEFAULT_REF"
          printf 'number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'trusted_ref=%s\n' "$TRUSTED_DEFAULT_REF" >> "$GITHUB_OUTPUT"

      - name: Resolve exact target PR
        id: target_pr
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_PR: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${EXPECTED_REPO}" > /tmp/expected-repository.json
          gh api "repos/${EXPECTED_REPO}/pulls/${EXPECTED_PR}" > /tmp/target-pr.json
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          sha_re = re.compile(r"^[0-9a-f]{40}$")
          expected_repo = os.environ["EXPECTED_REPO"]
          expected_pr = int(os.environ["EXPECTED_PR"])
          expected_head = os.environ["EXPECTED_HEAD_SHA"]
          repository = json.loads(
              Path("/tmp/expected-repository.json").read_text(encoding="utf-8")
          )
          pull_request = json.loads(
              Path("/tmp/target-pr.json").read_text(encoding="utf-8")
          )
          errors = []
          if repository.get("full_name") != expected_repo:
              errors.append("repository.full_name mismatch")
          if pull_request.get("number") != expected_pr:
              errors.append("pull_request.number mismatch")
          if pull_request.get("state") != "open":
              errors.append("pull_request.state is not open")
          live_head = str((pull_request.get("head") or {}).get("sha") or "")
          if not sha_re.fullmatch(live_head):
              errors.append("head.sha invalid")
          elif live_head != expected_head:
              errors.append("head.sha mismatch")
          base = pull_request.get("base") or {}
          if (base.get("repo") or {}).get("full_name") != expected_repo:
              errors.append("base.repo.full_name mismatch")
          base_sha = str(base.get("sha") or "")
          if not sha_re.fullmatch(base_sha):
              errors.append("base.sha invalid")
          if errors:
              raise SystemExit("TARGET_PR_IDENTITY_UNKNOWN: " + ",".join(errors))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"pr_number={expected_pr}\n")
              out.write(f"head_sha={live_head}\n")
              out.write(f"base_sha={base_sha}\n")
          PY

      - name: Checkout trusted audit source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.trusted_ref }}
          fetch-depth: 2
          path: trusted-source
          persist-credentials: false

      - name: Verify trusted audit source
        id: trusted_source
        env:
          EXPECTED_TRUSTED_REF: ${{ steps.pr.outputs.trusted_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C trusted-source rev-parse HEAD)"
          test -n "$actual_sha"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$EXPECTED_TRUSTED_REF" >> "$GITHUB_OUTPUT"

      - name: Verify requested audit commits
        id: head_integrity
        env:
          PR_NUMBER: ${{ steps.target_pr.outputs.pr_number }}
          TARGET_PR_HEAD_SHA: ${{ steps.target_pr.outputs.head_sha }}
          TARGET_PR_BASE_SHA: ${{ steps.target_pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          # Candidate code is never checked out or executed; only git objects are read.
          git -C trusted-source fetch --no-tags --depth=500 origin "$TARGET_PR_HEAD_SHA"
          git -C trusted-source fetch --no-tags --depth=500 origin "$TARGET_PR_BASE_SHA"
          git -C trusted-source cat-file -e "${TARGET_PR_HEAD_SHA}^{commit}"
          git -C trusted-source cat-file -e "${TARGET_PR_BASE_SHA}^{commit}"
          remote_head="$(
            git -C trusted-source ls-remote origin "refs/pull/${PR_NUMBER}/head" \
              | awk '{print $1}'
          )"
          test "$remote_head" = "$TARGET_PR_HEAD_SHA"
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

      - name: Install canonical schema validator
        if: always() && steps.head_integrity.outputs.verified == 'true'
        run: python -m pip install --quiet 'jsonschema>=4.20.0'

      - name: Classify trusted change contract
        id: change_contract
        if: always() && steps.head_integrity.outputs.verified == 'true'
        working-directory: trusted-source
        env:
          TARGET_PR_BASE_SHA: ${{ steps.target_pr.outputs.base_sha }}
          TARGET_PR_HEAD_SHA: ${{ steps.target_pr.outputs.head_sha }}
        run: |
          mkdir -p ../embedded-audit-artifacts
          set +e
          if [ -f scripts/governance/validate_change_contract.py ]; then
            python scripts/governance/validate_change_contract.py \
              --repo . \
              --base "$TARGET_PR_BASE_SHA" \
              --head "$TARGET_PR_HEAD_SHA" \
              --format json \
              > ../embedded-audit-artifacts/CHANGE_CONTRACT.json
            contract_exit=$?
          else
            contract_exit=2
            printf '%s\n' \
              '{"status":"FAIL","max_lane":"L3","model_audit_required":true,"proof_only":false,"paths":[],"findings":[{"code":"trusted_evaluator_missing","severity":"error","path":"scripts/governance/validate_change_contract.py","message":"Trusted evaluator missing"}],"notes":[]}' \
              > ../embedded-audit-artifacts/CHANGE_CONTRACT.json
          fi
          set -e
          python - "$contract_exit" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          contract_exit = int(sys.argv[1])
          payload = json.loads(
              Path("../embedded-audit-artifacts/CHANGE_CONTRACT.json").read_text(
                  encoding="utf-8"
              )
          )
          status = payload.get("status")
          lane = payload.get("max_lane")
          required = payload.get("model_audit_required")
          if status not in {"PASS", "FAIL"}:
              raise SystemExit("trusted change-contract status malformed")
          if lane not in {"L0", "L1", "L2", "L3"}:
              raise SystemExit("trusted change-contract lane malformed")
          if not isinstance(required, bool):
              raise SystemExit("trusted change-contract audit requirement malformed")
          if (status == "PASS") != (contract_exit == 0):
              raise SystemExit("trusted change-contract exit/status mismatch")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"status={status}\n")
              out.write(f"max_lane={lane}\n")
              out.write(f"model_audit_required={str(required).lower()}\n")
          PY

      - name: Evaluate signed imported audit evidence
        if: >-
          always() &&
          steps.change_contract.outputs.status == 'PASS' &&
          steps.change_contract.outputs.model_audit_required == 'true'
        working-directory: trusted-source
        env:
          PR_NUMBER: ${{ steps.target_pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target_pr.outputs.head_sha }}
          RISK_LANE: ${{ steps.change_contract.outputs.max_lane }}
        run: |
          set +e
          python -m scripts.audit.local_audit_acceptance \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --risk-lane "$RISK_LANE" \
            --allowed-signers config/audit/embedded-audit-allowed-signers \
            --schema schemas/proof/embedded_audit.schema.json \
            --out ../embedded-audit-artifacts/LOCAL_AUDIT_ATTESTATION.json
          acceptance_exit=$?
          set -e
          echo "signed evidence acceptance exit=${acceptance_exit}"
          exit 0

      - name: Emit audit evidence gate proof
        if: always() && steps.head_integrity.outputs.verified == 'true'
        working-directory: trusted-source
        env:
          PR_NUMBER: ${{ steps.target_pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target_pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.target_pr.outputs.base_sha }}
        run: |
          mkdir -p ../embedded-audit-artifacts
          if [ ! -f scripts/audit/run_embedded_audit.py ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          reason = "Trusted audit evidence emitter is missing on trusted ref."
          out = Path("../embedded-audit-artifacts")
          report_path = "proof/TP-DMX-AUDIT-CI-PROVENANCE-104/AUDITOR_REPORT.md"
          proof = {
              "packet_id": "TP-DMX-AUDIT-CI-PROVENANCE-104",
              "repo": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "executed": False,
              "mutation_performed": False,
              "github_mutation_route_added": False,
              "embedded_audit": {
                  "required": True,
                  "status": "SKIPPED",
                  "auditor_tool": "none",
                  "auditor_model": "unknown",
                  "invocation": None,
                  "exit_code": None,
                  "report_path": report_path,
                  "findings": [],
                  "fixes_applied": [],
                  "remaining_risks": [reason],
                  "skip_reason": reason,
              },
          }
          (out / "PROOF.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (out / "AUDITOR_REPORT.md").write_text(
              f"# Audit evidence gate\n\nstatus: SKIPPED\n\nreason: {reason}\n",
              encoding="utf-8",
          )
          PY
          else
            python scripts/audit/run_embedded_audit.py \
              --packet-id TP-DMX-AUDIT-CI-PROVENANCE-104 \
              --repo "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" \
              --base-sha "$BASE_SHA" \
              --change-contract-json ../embedded-audit-artifacts/CHANGE_CONTRACT.json \
              --local-attestation-json ../embedded-audit-artifacts/LOCAL_AUDIT_ATTESTATION.json \
              --out ../embedded-audit-artifacts
          fi

      - name: Emit unavailable audit evidence proof
        if: always() && steps.head_integrity.outputs.verified != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          mkdir -p embedded-audit-artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reason = "Requested repository, PR, base, or head identity could not be verified."
          out = Path("embedded-audit-artifacts")
          report_path = "proof/TP-DMX-AUDIT-CI-PROVENANCE-104/AUDITOR_REPORT.md"
          proof = {
              "packet_id": "TP-DMX-AUDIT-CI-PROVENANCE-104",
              "repo": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ.get("PR_NUMBER") or 0),
              "head_sha": os.environ.get("HEAD_SHA") or "",
              "executed": False,
              "mutation_performed": False,
              "github_mutation_route_added": False,
              "embedded_audit": {
                  "required": True,
                  "status": "SKIPPED",
                  "auditor_tool": "none",
                  "auditor_model": "unknown",
                  "invocation": None,
                  "exit_code": None,
                  "report_path": report_path,
                  "findings": [],
                  "fixes_applied": [],
                  "remaining_risks": [reason],
                  "skip_reason": reason,
              },
          }
          (out / "PROOF.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (out / "AUDITOR_REPORT.md").write_text(
              f"# Audit evidence gate\n\nstatus: SKIPPED\n\nreason: {reason}\n",
              encoding="utf-8",
          )
          PY

      - name: Enforce audit evidence gate
        if: always()
        env:
          EXPECTED_PR: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          proof_path = Path("embedded-audit-artifacts/PROOF.json")
          if not proof_path.is_file():
              raise SystemExit("Audit evidence proof is missing.")
          trusted_root = Path("trusted-source")
          if not trusted_root.is_dir():
              raise SystemExit("Trusted audit source is unavailable.")
          sys.path.insert(0, str(trusted_root.resolve()))
          from scripts.audit.run_embedded_audit import enforce_independent_audit_proof

          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          enforce_independent_audit_proof(
              proof,
              expected_pr=int(os.environ["EXPECTED_PR"]),
              expected_head_sha=os.environ["EXPECTED_HEAD_SHA"],
              expected_repo=os.environ["GITHUB_REPOSITORY"],
          )
          PY

      - name: Write job summary
        if: always()
        run: |
          {
            printf '## Audit evidence gate\n\n'
            printf -- '- model_calls: 0\n'
            printf -- '- paid_calls: 0\n'
            printf -- '- imported_signed_evidence_only: true\n'
            printf -- '- candidate_executed: false\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload embedded audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-audit-pr-${{ steps.pr.outputs.number }}-head-${{ steps.pr.outputs.head_sha }}-proof
          path: embedded-audit-artifacts/
          if-no-files-found: error
