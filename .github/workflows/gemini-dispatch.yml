name: '🔀 Gemini Dispatch'

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Gemini route to invoke'
        required: true
        type: choice
        default: 'review'
        options:
          - 'review'
          - 'triage'
          - 'invoke'
          - 'approve'
      target_type:
        description: 'Exact target type for the selected route'
        required: true
        type: choice
        options:
          - 'pull_request'
          - 'issue'
      issue_number:
        description: 'Pull request or issue number supplied to the selected route'
        required: true
        type: string
      target_head_sha:
        description: 'Exact live PR head SHA; empty for issue targets'
        required: false
        type: string
      additional_context:
        description: 'Bounded additional context for the selected route'
        required: false
        type: string
      allow_api_spend:
        description: 'Execution mechanism only; requires separate explicit operator spend authorization.'
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'

  dispatch:
    if: |-
      ${{ github.event_name == 'workflow_dispatch' && inputs.allow_api_spend == true }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      request: '${{ steps.extract_command.outputs.request }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      has_gemini_credentials: '${{ steps.detect_gemini_credentials.outputs.available }}'
      target_repository: '${{ steps.validate_target.outputs.target_repository }}'
      target_type: '${{ steps.validate_target.outputs.target_type }}'
      target_number: '${{ steps.validate_target.outputs.target_number }}'
      target_head_sha: '${{ steps.validate_target.outputs.target_head_sha }}'
      repository_mutation_authorized: 'false'
    steps:
      - name: 'Validate exact target'
        id: 'validate_target'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        env:
          EXPECTED_REPOSITORY: 'DDD-Enterprises/dopemux-mvp'
          COMMAND: '${{ inputs.command }}'
          TARGET_TYPE: '${{ inputs.target_type }}'
          TARGET_NUMBER: '${{ inputs.issue_number }}'
          TARGET_HEAD_SHA: '${{ inputs.target_head_sha }}'
        with:
          script: |-
            const expectedRepository = process.env.EXPECTED_REPOSITORY;
            const liveRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (liveRepository !== expectedRepository) {
              throw new Error('target_repository_mismatch');
            }
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (repository.data.full_name !== expectedRepository) {
              throw new Error('live_repository_identity_mismatch');
            }

            const command = process.env.COMMAND;
            const targetType = process.env.TARGET_TYPE;
            const targetNumberText = process.env.TARGET_NUMBER || '';
            const requestedHead = process.env.TARGET_HEAD_SHA || '';
            if (!/^[1-9][0-9]*$/.test(targetNumberText)) {
              throw new Error('target_number_invalid');
            }
            const targetNumber = Number(targetNumberText);
            if (!Number.isSafeInteger(targetNumber)) {
              throw new Error('target_number_invalid');
            }
            const allowedTypes = {
              review: ['pull_request'],
              triage: ['issue'],
              invoke: ['pull_request', 'issue'],
              approve: ['pull_request', 'issue'],
            };
            if (!allowedTypes[command]?.includes(targetType)) {
              throw new Error('command_target_type_mismatch');
            }

            let targetHead = '';
            if (targetType === 'pull_request') {
              if (!/^[0-9a-f]{40}$/.test(requestedHead)) {
                throw new Error('target_head_sha_invalid');
              }
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: targetNumber,
              });
              if (pull.data.state !== 'open') {
                throw new Error('target_pull_request_not_open');
              }
              targetHead = pull.data.head.sha;
              if (targetHead !== requestedHead) {
                throw new Error('target_head_sha_mismatch');
              }
            } else if (targetType === 'issue') {
              if (requestedHead !== '') {
                throw new Error('issue_target_head_sha_must_be_empty');
              }
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNumber,
              });
              if (issue.data.pull_request || issue.data.state !== 'open') {
                throw new Error('target_issue_invalid');
              }
            } else {
              throw new Error('target_type_invalid');
            }

            core.setOutput('target_repository', liveRepository);
            core.setOutput('target_type', targetType);
            core.setOutput('target_number', String(targetNumber));
            core.setOutput('target_head_sha', targetHead);

      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        env:
          COMMAND: '${{ inputs.command }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          script: |
            const command = process.env.COMMAND || 'fallthrough';
            core.setOutput('command', command);
            core.setOutput('request', process.env.ADDITIONAL_CONTEXT || '');
            core.setOutput('additional_context', process.env.ADDITIONAL_CONTEXT || '');

      - name: 'Detect Gemini credentials'
        id: 'detect_gemini_credentials'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          GCP_WIF_PROVIDER: '${{ vars.GCP_WIF_PROVIDER }}'
        run: |-
          if [[ -n "${GEMINI_API_KEY}" || -n "${GOOGLE_API_KEY}" || -n "${GCP_WIF_PROVIDER}" ]]; then
            echo 'available=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'available=false' >> "${GITHUB_OUTPUT}"
          fi

  review:
    needs: 'dispatch'
    if: |-
      ${{ github.event_name == 'workflow_dispatch' && inputs.allow_api_spend == true && needs.dispatch.outputs.command == 'review' && needs.dispatch.outputs.has_gemini_credentials == 'true' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    with:
      target_repository: '${{ needs.dispatch.outputs.target_repository }}'
      target_type: '${{ needs.dispatch.outputs.target_type }}'
      target_number: '${{ needs.dispatch.outputs.target_number }}'
      target_head_sha: '${{ needs.dispatch.outputs.target_head_sha }}'
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: |-
      ${{ github.event_name == 'workflow_dispatch' && inputs.allow_api_spend == true && needs.dispatch.outputs.command == 'triage' && needs.dispatch.outputs.has_gemini_credentials == 'true' }}
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    with:
      target_repository: '${{ needs.dispatch.outputs.target_repository }}'
      target_type: '${{ needs.dispatch.outputs.target_type }}'
      target_number: '${{ needs.dispatch.outputs.target_number }}'
      target_head_sha: '${{ needs.dispatch.outputs.target_head_sha }}'
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: |-
      ${{ github.event_name == 'workflow_dispatch' && inputs.allow_api_spend == true && needs.dispatch.outputs.command == 'invoke' && needs.dispatch.outputs.has_gemini_credentials == 'true' }}
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    with:
      target_repository: '${{ needs.dispatch.outputs.target_repository }}'
      target_type: '${{ needs.dispatch.outputs.target_type }}'
      target_number: '${{ needs.dispatch.outputs.target_number }}'
      target_head_sha: '${{ needs.dispatch.outputs.target_head_sha }}'
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  plan-execute:
    needs: 'dispatch'
    if: |-
      ${{ github.event_name == 'workflow_dispatch' && inputs.allow_api_spend == true && needs.dispatch.outputs.command == 'approve' && needs.dispatch.outputs.has_gemini_credentials == 'true' && needs.dispatch.outputs.repository_mutation_authorized == 'true' }}
    uses: './.github/workflows/gemini-plan-execute.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      target_repository: '${{ needs.dispatch.outputs.target_repository }}'
      target_type: '${{ needs.dispatch.outputs.target_type }}'
      target_number: '${{ needs.dispatch.outputs.target_number }}'
      target_head_sha: '${{ needs.dispatch.outputs.target_head_sha }}'
      repository_mutation_authorized: false
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
      - 'triage'
      - 'invoke'
      - 'plan-execute'
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Record fail-closed outcome'
        run: |-
          printf 'Gemini dispatch did not complete; no repository mutation performed.\n' \
            >> "$GITHUB_STEP_SUMMARY"
