name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'task-packets/**'
      - '**/*.md'
      - '.lychee.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'task-packets/**'
      - '**/*.md'
      - '.lychee.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/docs.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit
      - name: Run documentation hooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              pre-commit run --all-files
            else
              pre-commit run --from-ref "$BEFORE" --to-ref "${{ github.sha }}"
            fi
          fi
        env:
          SKIP: docs-graph-validator # Temporarily skipped for pre-existing validation issues.
      - name: Broken-link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml docs/**/*.md task-packets/**/*.md
          fail: false
