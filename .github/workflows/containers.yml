name: Container Build and Publish (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tools/**"
      - "services/**"
      - "docker/**"
      - "config/containers.json"
      - "scripts/ci/container_matrix.py"
      - "tests/arch/test_container_ci_alignment.py"
      - ".github/workflows/containers.yml"
      - ".github/workflows/docker-scout.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tools/**"
      - "services/**"
      - "docker/**"
      - "config/containers.json"
      - "scripts/ci/container_matrix.py"
      - "tests/arch/test_container_ci_alignment.py"
      - ".github/workflows/containers.yml"
      - ".github/workflows/docker-scout.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: ghcr.io/ddd-enterprises/dopemux-mvp

jobs:
  prepare:
    name: Validate container inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate checked-in container manifest
        run: python scripts/ci/container_matrix.py validate-manifest

      - name: Validate manifest against canonical Compose wiring
        run: python scripts/ci/container_matrix.py validate-compose

      - name: Generate build matrix
        id: matrix
        run: python scripts/ci/container_matrix.py matrix --github-output "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.service }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve publication posture
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          enabled=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && { [ "${GITHUB_REF}" = "refs/heads/main" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; }; then
            enabled=true
          fi
          if [ "${{ matrix.publish }}" != "true" ]; then
            enabled=false
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Detect Docker Hardened Images dependency
        id: dhi_required
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^FROM[[:space:]]+dhi\.io/' "${{ matrix.dockerfile }}"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: ${{ steps.publish.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hardened Images
        id: dhi_login
        if: ${{ steps.dhi_required.outputs.enabled == 'true' && env.DHI_TOKEN != '' }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ github.actor }}
          password: ${{ env.DHI_TOKEN }}

      - name: Fail closed when hardened bases cannot be published
        if: ${{ steps.dhi_required.outputs.enabled == 'true' && steps.dhi_login.outcome != 'success' && steps.publish.outputs.enabled == 'true' }}
        shell: bash
        run: |
          echo "::error::${{ matrix.service }} uses a dhi.io base image, but DHI authentication is unavailable. Refusing to publish a different public-base artifact."
          exit 1

      - name: Use public base fallback for pull-request verification
        if: ${{ steps.dhi_required.outputs.enabled == 'true' && steps.dhi_login.outcome != 'success' && steps.publish.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "::warning::DHI authentication is unavailable. Rewriting only ${{ matrix.dockerfile }} to public base references for non-publishing verification."
          sed -i 's|dhi.io/||g' "${{ matrix.dockerfile }}"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            io.dopemux.container.classification=${{ matrix.classification }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute smoke-test image reference
        id: image_ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ env.NAMESPACE }}/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.NAMESPACE }}/${{ matrix.image }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          load: ${{ steps.publish.outputs.enabled != 'true' && matrix.smoke_test == true }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: ${{ steps.publish.outputs.enabled == 'true' && 'mode=max' || false }}
          sbom: ${{ steps.publish.outputs.enabled == 'true' }}

      - name: Generate registry-backed provenance attestation
        if: ${{ steps.publish.outputs.enabled == 'true' && steps.build.outputs.digest != '' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Inspect loaded image metadata
        if: ${{ steps.publish.outputs.enabled != 'true' && matrix.smoke_test == true }}
        run: docker image inspect "${{ steps.image_ref.outputs.value }}" >/dev/null

      - name: Smoke test container startup
        if: ${{ steps.publish.outputs.enabled != 'true' && matrix.smoke_test == true }}
        env:
          IMAGE_REF: ${{ steps.image_ref.outputs.value }}
          CONTAINER_NAME: ci-${{ matrix.service }}
          SMOKE_PORT: ${{ matrix.smoke_port }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
        shell: bash
        run: |
          set -euo pipefail

          container_started=false
          cleanup() {
            if [ "$container_started" = true ]; then
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
            fi
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT

          extra_env_args=()
          if [ "${{ matrix.service }}" = "adhd-engine" ]; then
            extra_env_args+=( -e ADHD_ENGINE_ALLOW_DEGRADED_STARTUP=1 )
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p "${SMOKE_PORT}:${SMOKE_PORT}" \
            "${extra_env_args[@]}" \
            "$IMAGE_REF"
          container_started=true

          health_url="http://127.0.0.1:${SMOKE_PORT}${SMOKE_PATH}"
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME" 2>&1 || true)"
            if echo "$state" | grep -q "No such object"; then
              echo "::error::Container disappeared before becoming healthy."
              exit 1
            fi
            if [ "$state" = "exited" ]; then
              echo "::error::Container exited before becoming healthy."
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
              exit 1
            fi
            health_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$CONTAINER_NAME" 2>/dev/null || true)"
            if [ "$health_state" = "healthy" ]; then
              break
            fi
            if curl -fsS "$health_url" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS "$health_url"

      - name: Write container proof record
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ env.NAMESPACE }}/${{ matrix.image }}
          CLASSIFICATION: ${{ matrix.classification }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          PLATFORM: ${{ matrix.platform }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ steps.publish.outputs.enabled }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "schema_version": "1.0.0",
              "service": os.environ["SERVICE"],
              "image": os.environ["IMAGE"],
              "classification": os.environ["CLASSIFICATION"],
              "dockerfile": os.environ["DOCKERFILE"],
              "context": os.environ["CONTEXT"],
              "platform": os.environ["PLATFORM"],
              "tags": [line for line in os.environ.get("TAGS", "").splitlines() if line],
              "digest": os.environ.get("DIGEST") or None,
              "published": os.environ.get("PUBLISHED") == "true",
              "head_sha": os.environ["HEAD_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
          }
          Path("container-proof.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload container proof record
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: container-proof-${{ matrix.service }}
          path: container-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.service }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ env.NAMESPACE }}/${{ matrix.image }}\` |"
            echo "| Classification | \`${{ matrix.classification }}\` |"
            echo "| Dockerfile | \`${{ matrix.dockerfile }}\` |"
            echo "| Tags | ${{ steps.meta.outputs.tags }} |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Published | \`${{ steps.publish.outputs.enabled }}\` |"
            echo "| Smoke tested | \`${{ steps.publish.outputs.enabled != 'true' && matrix.smoke_test == true }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
