name: Container Build and Publish (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.frontend'
      - 'services/**/Dockerfile*'
      - 'docker/**/Dockerfile*'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.frontend'
      - 'services/**/Dockerfile*'
      - 'docker/**/Dockerfile*'
      - '.github/workflows/containers.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: ghcr.io/ddd-enterprises/dopemux-mvp

jobs:
  build:
    name: "Build ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}

          - service: dopemux-backend
            dockerfile: Dockerfile
            context: .

          # -- Frontend
          # Removed - ui-dashboard deprecated

          # -- MCP: ConPort
          - service: conport
            dockerfile: docker/mcp-servers-source/conport/Dockerfile
            context: .

          # -- MCP: LiteLLM proxy
          - service: litellm
            dockerfile: docker/mcp-servers-source/litellm/Dockerfile
            context: .

          # -- Cognitive: Task Orchestrator
          - service: task-orchestrator
            dockerfile: services/task-orchestrator/Dockerfile
            context: .

          # -- Cognitive: Claude Brain
          - service: claude-brain
            dockerfile: services/claude_brain/Dockerfile
            context: .

          # -- Cognitive: ADHD Engine
          - service: adhd-engine
            dockerfile: services/adhd_engine/Dockerfile
            context: .

          # -- Coordination: DopeconBridge
          - service: dopecon-bridge
            dockerfile: services/dopecon-bridge/Dockerfile
            context: .

          # -- Integration: Webhook Receiver
          - service: webhook-receiver
            dockerfile: services/webhook_receiver/Dockerfile
            context: .

          # -- Memory: Dope Memory
          - service: dope-memory
            dockerfile: services/working-memory-assistant/Dockerfile.dope-memory
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hardened Images (dhi.io)
        if: ${{ env.DHI_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ github.actor }}
          password: ${{ env.DHI_TOKEN }}

      - name: Check DHI token availability
        if: ${{ env.DHI_TOKEN == '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::error::DHI_TOKEN secret is required to build images that depend on dhi.io base images. Configure secrets.DHI_TOKEN in repository or organization settings."
            exit 1
          fi
          echo "::warning::DHI_TOKEN secret is not available in this context. Any Dockerfiles that use dhi.io/* base images may fail with a 'pull access denied' error during build."

      - name: Fallback to public images (if DHI_TOKEN missing)
        if: ${{ env.DHI_TOKEN == '' }}
        run: |
          echo "🔄 DHI_TOKEN missing. Replacing dhi.io/ with public Docker Hub images..."
          find . -name "Dockerfile*" -type f -exec sed -i 's|dhi.io/||g' {} +

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.service }}
          tags: |
            # Tag as 'latest' on main branch pushes
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Always tag with the git SHA (short)
            type=sha,prefix=,format=short
            # Tag PRs with pr-<number>
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Push only on main branch; PRs build only (no push)
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GHA cache backend
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: Build Summary
        if: always()
        run: |
          echo "## ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.NAMESPACE }}/${{ matrix.service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pushed | ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }} |" >> $GITHUB_STEP_SUMMARY
