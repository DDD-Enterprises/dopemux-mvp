name: 🔒 Security Review with Claude Code

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/**'
      - 'CODEOWNERS'
      - 'config/**'
      - 'schemas/**'
      - 'src/dopemux/dcp/**'
      - 'tools/pr_steward/**'
      - 'services/**/auth*'
      - 'services/**/security*'
      - 'Dockerfile*'
      - 'compose*.yml'
      - 'docker/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configuration:
    name: Detect Claude security-review configuration
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Detect API credential
        id: detect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is unavailable; the optional Claude security review will be skipped."
          fi

  security-review:
    name: Claude Code security analysis
    needs: configuration
    if: >-
      needs.configuration.outputs.available == 'true' &&
      github.repository == 'DDD-Enterprises/dopemux-mvp' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Run focused security review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, pinned 2026-07-22
        with:
          comment-pr: ${{ github.event_name == 'pull_request' }}
          claude-api-key: ${{ env.ANTHROPIC_API_KEY }}
          upload-results: true
          claudecode-timeout: '20'
          custom-security-scan-instructions: ${{ github.workspace }}/.github/security-scan-instructions.txt
          false-positive-filtering-instructions: ${{ github.workspace }}/.github/security-filtering-instructions.txt
          exclude-directories: 'tests,__pycache__,node_modules,.git,docker/leantime/data'
          run-every-commit: false

  security-summary:
    name: Security review summary
    runs-on: ubuntu-latest
    needs: [configuration, security-review]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Generate truthful security report
        env:
          CONFIGURED: ${{ needs.configuration.outputs.available }}
          REVIEW_RESULT: ${{ needs.security-review.result }}
        run: |
          {
            echo '## 🔒 Security review'
            echo
            if [ "$CONFIGURED" != 'true' ]; then
              echo '⏭️ Optional Claude review was not configured. No AI security verdict was produced.'
            elif [ "$REVIEW_RESULT" = 'success' ]; then
              echo '✅ Claude security-review action completed. Findings, if any, are in the PR review and artifacts.'
            elif [ "$REVIEW_RESULT" = 'skipped' ]; then
              echo '⏭️ Claude review was skipped by the trusted-PR gate.'
            else
              echo "❌ Claude review did not complete successfully (result: $REVIEW_RESULT)."
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
