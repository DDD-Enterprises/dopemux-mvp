name: Complete CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Verify dopetask pin contract
        run: |
          if [[ ! -f .dopetask-pin ]]; then
            echo 'ERROR: .dopetask-pin is missing (required by architecture contract)' >&2
            exit 1
          fi
          echo "Found .dopetask-pin: $(cat .dopetask-pin)"

      - name: Enforce repo root hygiene
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo 'Fallback activated: diffing against origin/main.'
              git fetch origin main --depth=1
              CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR origin/main...HEAD)"
            else
              CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$BEFORE" "${{ github.sha }}")"
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo 'No changed files to validate for root hygiene.'
            exit 0
          fi

          echo "$CHANGED_FILES" | tr '\n' '\0' | xargs -0 -r python scripts/check_root_hygiene.py --quiet

      - name: Run pre-commit
        id: precommit
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            git fetch origin "${{ github.base_ref }}"
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo 'Fallback activated: running pre-commit from origin/main.'
              git fetch origin main --depth=1
              pre-commit run --from-ref origin/main --to-ref HEAD
            else
              pre-commit run --from-ref "$BEFORE" --to-ref "${{ github.sha }}"
            fi
          fi
        env:
          SKIP: docs-graph-validator

      - name: Write code-quality summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Code Quality Check'
            echo
            if [ "$JOB_STATUS" = 'success' ]; then
              echo '✅ Root hygiene and pre-commit checks passed.'
            else
              echo '❌ Code-quality checks failed. Inspect the failing step above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync fast unit-test environment
        run: uv sync --frozen --extra test --extra services

      - name: Run fast unit gate
        run: |
          uv run --frozen pytest \
            tests/unit \
            tests/test_voice_core.py \
            tests/test_brand_voice.py \
            -n auto --maxfail=1 --disable-warnings --no-cov

      - name: Run dope-memory MCP endpoint gate
        run: |
          uv run --frozen pytest \
            services/working-memory-assistant/tests/test_mcp_http_endpoint.py \
            --maxfail=1 --disable-warnings --no-cov

      - name: 🔴 Run DCP red-lane gate (TP-DMX-DCP-CI-GATE-001)
        run: |
          PYTHONPATH=src uv run --frozen pytest \
            tests/dcp/ \
            --deselect tests/dcp/test_dcp_0002_contract_derivation.py::test_16_no_forbidden_files_modified \
            --maxfail=1 --disable-warnings --no-cov

      - name: Run brand lint gate
        run: uv run --frozen python scripts/brand_lint.py

      - name: Run interactive import smoke
        run: |
          uv run --frozen python - <<'PY'
          import importlib

          modules = [
              'dopemux.ux.interactive_prompts',
              'dopemux.ux.wizard.extraction',
              'dopemux.ux.wizard.prompts',
              'dopemux.ux.wizard.cost_profiles',
              'dopemux.ux.wizard.runner',
          ]
          for name in modules:
              importlib.import_module(name)
              print(f'import-ok {name}')
          PY

  extractor-smoke:
    name: Extractor Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync extractor smoke environment
        run: uv sync --frozen --extra test --extra services

      - name: Run extractor smoke gate
        run: >-
          uv run --frozen pytest
          services/repo-truth-extractor/tests/test_run_extraction_v4_core.py
          services/repo-truth-extractor/tests/test_rte_live_cert_characterization.py
          services/repo-truth-extractor/tests/test_rte_v5_characterization.py
          services/repo-truth-extractor/tests/test_truth_run_cli.py
          services/repo-truth-extractor/tests/test_run_extraction_v5_promptset_truth.py
          services/repo-truth-extractor/tests/test_run_extraction_v5_validator.py
          tests/unit/test_cli_upgrades_commands.py
          -n auto --maxfail=1 --disable-warnings --no-cov

  audit-validator:
    name: Audit Proof Validator (--all)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate in-scope proof bundles
        run: python scripts/audit/validate_audit_proof.py --all proof/

  routing-consistency:
    name: Model Routing Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml pytest-asyncio

      - name: Run routing consistency gate
        run: pytest tests/test_model_routing_consistency.py --noconftest -q --tb=short

  extractor-full:
    name: Extractor Full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync extractor full environment
        run: uv sync --frozen --extra test --extra services

      - name: Run extractor full gate
        run: |
          PYTHONPATH=src uv run --frozen pytest \
            services/repo-truth-extractor/tests/ \
            -n auto --dist worksteal \
            -q --tb=short --disable-warnings --no-cov \
            --durations=40 --durations-min=0.05

  auditor-router:
    name: Auditor Router
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync auditor-router environment
        run: uv sync --frozen --extra test --extra services

      - name: Run auditor-router gate
        run: |
          PYTHONPATH=src uv run --frozen pytest \
            tests/auditor_router/ \
            -q --tb=short --disable-warnings --no-cov

  installer-smoke:
    name: Installer Smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install installer smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq curl sqlite3

      - name: Run installer smoke tests
        run: |
          chmod +x test_installer_basic.sh
          ./test_installer_basic.sh

  scoped-coverage:
    name: Scoped Coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync scoped coverage environment
        run: uv sync --frozen --extra test

      - name: Run scoped coverage checks
        run: |
          chmod +x scripts/check_coverage.sh
          ./scripts/check_coverage.sh

  integration:
    name: Integration Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync integration environment
        run: uv sync --frozen --extra test --extra services

      - name: Run integration lane
        run: uv run --frozen pytest tests/integration -n auto --maxfail=1 --disable-warnings --no-cov

  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - tests
      - extractor-smoke
      - audit-validator
      - routing-consistency
      - extractor-full
      - auditor-router
      - installer-smoke
      - scoped-coverage
      - integration
    if: always()
    steps:
      - name: Write results and enforce PR gate
        env:
          CODE_QUALITY: ${{ needs.code-quality.result || 'missing' }}
          TESTS: ${{ needs.tests.result || 'missing' }}
          EXTRACTOR_SMOKE: ${{ needs.extractor-smoke.result || 'missing' }}
          AUDIT_VALIDATOR: ${{ needs.audit-validator.result || 'missing' }}
          ROUTING_CONSISTENCY: ${{ needs.routing-consistency.result || 'missing' }}
          EXTRACTOR_FULL: ${{ needs.extractor-full.result || 'missing' }}
          AUDITOR_ROUTER: ${{ needs.auditor-router.result || 'missing' }}
          INSTALLER_SMOKE: ${{ needs.installer-smoke.result || 'missing' }}
          SCOPED_COVERAGE: ${{ needs.scoped-coverage.result || 'missing' }}
          INTEGRATION: ${{ needs.integration.result || 'missing' }}
        run: |
          set -euo pipefail
          {
            echo '## Dopemux CI Pipeline'
            echo
            printf '| Lane | Result |\n|---|---|\n'
            printf '| Code quality | `%s` |\n' "$CODE_QUALITY"
            printf '| Unit tests | `%s` |\n' "$TESTS"
            printf '| Extractor smoke | `%s` |\n' "$EXTRACTOR_SMOKE"
            printf '| Audit proof validator | `%s` |\n' "$AUDIT_VALIDATOR"
            printf '| Routing consistency | `%s` |\n' "$ROUTING_CONSISTENCY"
            printf '| Extractor full | `%s` |\n' "$EXTRACTOR_FULL"
            printf '| Auditor router | `%s` |\n' "$AUDITOR_ROUTER"
            printf '| Installer smoke | `%s` |\n' "$INSTALLER_SMOKE"
            printf '| Scoped coverage | `%s` |\n' "$SCOPED_COVERAGE"
            printf '| Integration | `%s` |\n' "$INTEGRATION"
          } >> "$GITHUB_STEP_SUMMARY"

          gate_ok=true
          [ "$CODE_QUALITY" != 'success' ] && gate_ok=false
          [ "$TESTS" != 'success' ] && gate_ok=false
          [ "$EXTRACTOR_SMOKE" != 'success' ] && gate_ok=false
          [ "$AUDIT_VALIDATOR" != 'success' ] && gate_ok=false
          [ "$ROUTING_CONSISTENCY" != 'success' ] && gate_ok=false
          [ "$EXTRACTOR_FULL" != 'success' ] && gate_ok=false
          [ "$AUDITOR_ROUTER" != 'success' ] && gate_ok=false

          if [ "$gate_ok" != 'true' ]; then
            {
              echo
              echo '### ❌ PR Gate: BLOCKED'
              echo "Required checks failed: code-quality=$CODE_QUALITY tests=$TESTS extractor-smoke=$EXTRACTOR_SMOKE audit-validator=$AUDIT_VALIDATOR routing-consistency=$ROUTING_CONSISTENCY extractor-full=$EXTRACTOR_FULL auditor-router=$AUDITOR_ROUTER"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo
            echo '### ✅ PR Gate: CLEAR'
            echo 'External AI security review and documentation link checks are handled by their dedicated, path-scoped workflows.'
          } >> "$GITHUB_STEP_SUMMARY"
