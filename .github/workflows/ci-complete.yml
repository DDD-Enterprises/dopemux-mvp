name: 🚀 Complete CI Pipeline (ADHD-Optimized)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # ADHD-friendly: cancel outdated runs

jobs:
  # ADHD chunk #1: Code quality (fast feedback)
  code-quality:
    name: "💅 Code Quality & Linting"
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Quick feedback loop

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install pre-commit & deps
        run: |
          pip install pre-commit
          pre-commit install --install-hooks

      - name: 📌 Verify dopetask pin contract
        run: |
          if [[ ! -f .dopetask-pin ]]; then
            echo "ERROR: .dopetask-pin is missing (required by arch contract)" >&2
            exit 1
          fi
          echo "Found .dopetask-pin: $(cat .dopetask-pin)"


      - name: 🧹 Enforce repo root hygiene
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              # Fallback to main if it's a new branch push
              echo "Fallback activated: github.event.before is unavailable in this checkout; diffing against origin/main."
              git fetch origin main --depth=1
              CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR origin/main...HEAD)"
            else
              CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$BEFORE" "${{ github.sha }}")"
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files to validate for root hygiene."
            exit 0
          fi

          echo "$CHANGED_FILES" | tr '\n' '\0' | xargs -0 -r python scripts/check_root_hygiene.py --quiet

      - name: 🔍 Run pre-commit (code quality)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              # Fallback to main if it's a new branch push
              echo "Fallback activated: github.event.before is unavailable in this checkout; running pre-commit from origin/main."
              git fetch origin main --depth=1
              pre-commit run --from-ref origin/main --to-ref HEAD
            else
              pre-commit run --from-ref "$BEFORE" --to-ref "${{ github.sha }}"
            fi
          fi
        env:
          SKIP: docs-graph-validator  # Temporarily skip graph validator (pre-existing validation issues)

      - name: 🎯 ADHD-Friendly Summary
        if: always()
        run: |
          echo "## 💅 Code Quality Check" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **Code looks great!** Ready for the next step." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Code quality items found** - Check the details above." >> $GITHUB_STEP_SUMMARY
            echo "_Focus on the most important fixes first._" >> $GITHUB_STEP_SUMMARY
          fi

  # ADHD chunk #2: Security (takes longer, separate job)
  security:
    name: "🔒 Security Review"
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 25-minute focus session
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: 🛡️ AI-Powered Security Analysis
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ env.ANTHROPIC_API_KEY }}
          custom-security-scan-instructions: .github/security-scan-instructions.txt
          false-positive-filtering-instructions: .github/security-filtering-instructions.txt
          claudecode-timeout: "20"

      - name: 🎯 Gentle Security Summary
        if: always() && github.event_name == 'pull_request'
        run: |
          echo "## 🔒 Security Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "AI-powered analysis finished! Check PR comments for details." >> $GITHUB_STEP_SUMMARY
          echo "_Remember: Security is about progress, not perfection._" >> $GITHUB_STEP_SUMMARY

  docs:
    name: "📚 Documentation Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔗 Check links (lychee)
        uses: lycheeverse/lychee-action@v2  # Security: Fixed code injection vulnerability in v1
        with:
          args: --config .lychee.toml docs/**/*.md README.md
          fail: false

      - name: 📖 Documentation Summary
        if: always()
        run: |
          echo "## 📚 Documentation Check" >> $GITHUB_STEP_SUMMARY
          echo "Link checking completed! Your docs are being kept current." >> $GITHUB_STEP_SUMMARY

  tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📦 Sync fast unit test environment
        run: uv sync --frozen --extra test --extra services

      - name: ▶️ Run fast unit gate
        run: |
          uv run --frozen pytest \
            tests/unit \
            tests/test_voice_core.py \
            tests/test_brand_voice.py \
            -n auto --maxfail=1 --disable-warnings --no-cov

      - name: 🎨 Run brand lint gate
        run: uv run --frozen python scripts/brand_lint.py

      - name: 🧩 Run interactive import smoke
        run: |
          uv run --frozen python - <<'PY'
          import importlib
          modules = [
              "dopemux.ux.interactive_prompts",
              "dopemux.ux.wizard.extraction",
              "dopemux.ux.wizard.prompts",
              "dopemux.ux.wizard.cost_profiles",
              "dopemux.ux.wizard.runner",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"import-ok {name}")
          PY

  tests-sharded-experiment:
    name: "🧪 Unit Tests (Shard Experiment ${{ matrix.shard_label }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_total: 2
            shard_label: "1/2"
          - shard_index: 1
            shard_total: 2
            shard_label: "2/2"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📦 Sync sharded unit test environment
        run: uv sync --frozen --extra test --extra services

      - name: 🧮 Build deterministic shard file list
        id: shard
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
        run: |
          python - <<'PY'
          import os
          import shlex
          from pathlib import Path

          shard_index = int(os.environ["SHARD_INDEX"])
          shard_total = int(os.environ["SHARD_TOTAL"])

          unit_files = sorted(str(path) for path in Path("tests/unit").rglob("test_*.py"))
          selected = unit_files[shard_index::shard_total]

          if shard_index == shard_total - 1:
              selected.extend([
                  "tests/test_voice_core.py",
                  "tests/test_brand_voice.py",
              ])

          shard_args = " ".join(shlex.quote(path) for path in selected)

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"file_count={len(selected)}\n")
              handle.write(f"pytest_args={shard_args}\n")
          PY

      - name: ▶️ Run sharded unit experiment
        env:
          PYTEST_ARGS: ${{ steps.shard.outputs.pytest_args }}
        run: |
          start_ts=$(date +%s)
          eval "uv run --frozen pytest ${PYTEST_ARGS} -n auto --maxfail=1 --disable-warnings --no-cov"
          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))
          echo "## 🧪 Unit shard experiment ${{ matrix.shard_label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files: ${{ steps.shard.outputs.file_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration (s): ${elapsed}" >> "$GITHUB_STEP_SUMMARY"

  extractor-smoke:
    name: "🧪 Extractor Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📦 Sync extractor smoke environment
        run: uv sync --frozen --extra test --extra services

      - name: ▶️ Run extractor smoke gate
        run: >
          uv run --frozen pytest
          services/repo-truth-extractor/tests/test_run_extraction_v4_core.py
          services/repo-truth-extractor/tests/test_rte_live_cert_characterization.py
          services/repo-truth-extractor/tests/test_rte_v5_characterization.py
          services/repo-truth-extractor/tests/test_truth_run_cli.py
          services/repo-truth-extractor/tests/test_run_extraction_v5_promptset_truth.py
          services/repo-truth-extractor/tests/test_run_extraction_v5_validator.py
          tests/unit/test_cli_upgrades_commands.py
          -n auto --maxfail=1 --disable-warnings --no-cov

  extractor-full:
    name: "🧪 Extractor Full (Advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      suite_status: ${{ steps.extractor_full.outputs.suite_status }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📦 Sync extractor full environment
        run: uv sync --frozen --extra test --extra services

      - id: extractor_full
        name: ▶️ Run extractor full lane (advisory)
        run: |
          set +e
          uv run --frozen pytest services/repo-truth-extractor/tests -n auto --maxfail=1 --disable-warnings --no-cov
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "suite_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "suite_status=failing" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  installer-smoke:
    name: "🧪 Installer Smoke"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧪 Run installer smoke tests
        run: |
          chmod +x test_installer_basic.sh
          ./test_installer_basic.sh

  scoped-coverage:
    name: "📊 Scoped Coverage"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📦 Sync scoped coverage environment
        run: uv sync --frozen --extra test

      - name: ▶️ Run scoped coverage checks
        run: |
          chmod +x scripts/check_coverage.sh
          ./scripts/check_coverage.sh

  integration:
    name: "🔗 Integration Tests"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📦 Sync integration environment
        run: uv sync --frozen --extra test --extra services

      - name: ▶️ Run integration lane
        run: uv run --frozen pytest tests/integration -n auto --maxfail=1 --disable-warnings --no-cov

  # Final summary for ADHD-friendly overview
  ci-summary:
    name: "📊 CI Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [code-quality, security, docs, tests, extractor-smoke, extractor-full, installer-smoke, scoped-coverage, integration]
    if: always()



    steps:
      - name: 🎉 ADHD-Optimized Results Summary
        run: |
          echo "## 🚀 Dopemux CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Code Quality Status
          if [ "${{ needs.code-quality.result }}" == "success" ]; then
            echo "✅ **Code Quality:** Passing - Code is clean and consistent!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Code Quality:** Needs attention - Small fixes needed" >> $GITHUB_STEP_SUMMARY
          fi

          # Security Status
          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "✅ **Security:** Clear - Memory systems are secure!" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security.result }}" == "skipped" ]; then
            echo "⏭️ **Security:** Skipped - API key missing or not required" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔒 **Security:** Review needed - Check findings above" >> $GITHUB_STEP_SUMMARY
          fi

          # Documentation Status
          if [ "${{ needs.docs.result }}" == "success" ]; then
            echo "✅ **Documentation:** Links working - Docs are current!" >> $GITHUB_STEP_SUMMARY
          else
            echo "📝 **Documentation:** Links need fixing - Minor updates needed" >> $GITHUB_STEP_SUMMARY
          fi

          # Tests Status
          if [ "${{ needs.tests.result }}" == "success" ]; then
            echo "✅ **Unit Tests:** Passing - Fast PR gate is healthy." >> $GITHUB_STEP_SUMMARY
          else
            echo "🧪 **Unit Tests:** Failing - Fix regressions before merge" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.extractor-smoke.result }}" == "success" ]; then
            echo "✅ **Extractor Smoke:** Passing - focused canonical RTE gate is healthy." >> $GITHUB_STEP_SUMMARY
          else
            echo "🧪 **Extractor Smoke:** Failing - stabilize focused RTE regressions before merge." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.extractor-full.outputs.suite_status }}" == "passing" ]; then
            echo "✅ **Extractor Full (Advisory):** Passing - broader RTE suite is currently clean." >> $GITHUB_STEP_SUMMARY
          else
            echo "🧪 **Extractor Full (Advisory):** Failing - visible but non-blocking until stabilization completes." >> $GITHUB_STEP_SUMMARY
          fi

          # Advisory lanes
          if [ "${{ needs.installer-smoke.result }}" == "success" ]; then
            echo "✅ **Installer Smoke:** Passing on slower lane." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.installer-smoke.result }}" == "skipped" ]; then
            echo "⏭️ **Installer Smoke:** Skipped on the PR fast path." >> $GITHUB_STEP_SUMMARY
          else
            echo "🧪 **Installer Smoke:** Needs attention on slower lane." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.scoped-coverage.result }}" == "success" ]; then
            echo "✅ **Scoped Coverage:** Passing on slower lane." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.scoped-coverage.result }}" == "skipped" ]; then
            echo "⏭️ **Scoped Coverage:** Skipped on the PR fast path." >> $GITHUB_STEP_SUMMARY
          else
            echo "📊 **Scoped Coverage:** Needs attention on slower lane." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.integration.result }}" == "success" ]; then
            echo "✅ **Integration Tests:** Passing on slower lane." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration.result }}" == "skipped" ]; then
            echo "⏭️ **Integration Tests:** Skipped on the PR fast path." >> $GITHUB_STEP_SUMMARY
          else
            echo "🔗 **Integration Tests:** Needs attention on slower lane." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 ADHD-Friendly Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.code-quality.result }}" == "success" ] && [ "${{ needs.security.result }}" == "success" ] && [ "${{ needs.docs.result }}" == "success" ] && [ "${{ needs.tests.result }}" == "success" ] && [ "${{ needs.extractor-smoke.result }}" == "success" ]; then
            echo "**🎉 Excellent work!** All checks passed. Ready to merge when you are!" >> $GITHUB_STEP_SUMMARY
            echo "_Take a well-deserved break - you've earned it._" >> $GITHUB_STEP_SUMMARY
          else
            echo "**📋 Focus areas:** Fix required checks first, then address any slower-lane issues." >> $GITHUB_STEP_SUMMARY
            echo "**⏰ Tip:** Use 25-minute Pomodoro sessions for fixes." >> $GITHUB_STEP_SUMMARY
            echo "**🤝 Need help?** Ask in the PR discussion!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Powered by Dopemux ADHD-optimized CI/CD*" >> $GITHUB_STEP_SUMMARY
