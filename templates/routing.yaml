# Dopemux Global Routing Configuration
#
# This file defines the global LiteLLM routing strategy for all Dopemux instances
# on this macOS user account. It is managed by `dopemux routing` commands.
#
# DO NOT EDIT THIS FILE DIRECTLY unless you understand the full implications.
# Use `dopemux routing edit` to safely modify and validate changes.
#
# Changes require `dopemux routing reload` to take effect.

version: 1

# Routing mode: determines how Claude Code requests are handled
# - "subscription": Direct to Anthropic (no proxy, requires ANTHROPIC_API_KEY)
# - "api": Route through global LiteLLM proxy (requires LiteLLM services)
mode: api

# Port configuration for LiteLLM and CCR services
ports:
  litellm: 4000
  ccr: 4010

# Provider definitions - API keys are NOT stored here
# Keys must be in ~/.dopemux/routing.env
providers:
  - name: gemini
    label: "Google Gemini"
    api_key_env: "GEMINI_API_KEY"

  - name: xai
    label: "xAI Grok"
    api_key_env: "XAI_API_KEY"
    base_url: "https://api.x.ai/v1"

  - name: openai
    label: "OpenAI"
    api_key_env: "OPENAI_API_KEY"

  - name: openrouter
    label: "OpenRouter"
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    extra_headers:
      HTTP-Referer: "https://dopemux.local"
      X-Title: "Dopemux LiteLLM Proxy"

  - name: ollama
    label: "Ollama Local"
    auth_mode: "none"
    base_url: "http://127.0.0.1:11434"

  - name: lmstudio
    label: "LM Studio Local"
    auth_mode: "none"
    api_key: "lmstudio"
    base_url: "http://127.0.0.1:1234/v1"

  - name: groq
    label: "Groq Free Tier"
    api_key_env: "GROQ_API_KEY"

  - name: cerebras
    label: "Cerebras Free Tier"
    api_key_env: "CEREBRAS_API_KEY"

  - name: openrouter_free
    label: "OpenRouter Free Models"
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    extra_headers:
      HTTP-Referer: "https://dopemux.local"
      X-Title: "Dopemux LiteLLM Proxy"

  - name: cloudflare_workers_ai
    label: "Cloudflare Workers AI Free Allocation"
    api_key_env: "CLOUDFLARE_API_TOKEN"

  - name: cohere_trial
    label: "Cohere Trial"
    api_key_env: "COHERE_API_KEY"

  - name: mistral_experiment
    label: "Mistral Experiment Plan"
    api_key_env: "MISTRAL_API_KEY"

  - name: github_models_poc
    label: "GitHub Models POC"
    api_key_env: "GITHUB_TOKEN"

  - name: hf_credits
    label: "Hugging Face Monthly Credits"
    api_key_env: "HF_TOKEN"

# Model definitions - reference providers by name
models:
  # GEMINI (direct via Google AI)
  - name: gemini-2.5-flash-lite
    provider: gemini
    model_id: "gemini/gemini-2.5-flash-lite"
    max_tokens: 131072

  - name: gemini-2.5-flash
    provider: gemini
    model_id: "gemini/gemini-2.5-flash"
    max_tokens: 131072

  - name: gemini-2.5-pro
    provider: gemini
    model_id: "gemini/gemini-2.5-pro"
    max_tokens: 131072

  # XAI / GROK (direct)
  - name: grok-4.20-beta-reasoning
    provider: xai
    model_id: "xai/grok-4.20-beta-reasoning"
    max_tokens: 2000000

  - name: grok-4.20-multi-agent-beta
    provider: xai
    model_id: "xai/grok-4.20-multi-agent-beta"
    max_tokens: 2000000

  - name: grok-4.20-heavy
    provider: xai
    model_id: "xai/grok-4.20-heavy"
    max_tokens: 2000000

  - name: grok-code-fast-1
    provider: xai
    model_id: "xai/grok-code-fast-1"
    max_tokens: 131072

  # OPENAI (direct)
  - name: gpt-5.4-pro
    provider: openai
    model_id: "openai/gpt-5.4-pro"
    max_tokens: 272000

  - name: gpt-5.4-thinking
    provider: openai
    model_id: "openai/gpt-5.4-thinking"
    max_tokens: 272000

  - name: gpt-5.4-mini
    provider: openai
    model_id: "openai/gpt-5.4-mini"
    max_tokens: 272000

  - name: gpt-5.4-nano
    provider: openai
    model_id: "openai/gpt-5.4-nano"
    max_tokens: 272000

  # OPENROUTER (aggregator)
  - name: openrouter-gpt-5.4-pro
    provider: openrouter
    model_id: "openrouter/openai/gpt-5.4-pro"
    max_tokens: 272000

  # STRICT-FREE LOCAL / HOSTED-FREE ROUTES
  - name: ollama-qwen3-coder
    provider: ollama
    model_id: "ollama/qwen3-coder"
    max_tokens: 32768

  - name: lmstudio-local
    provider: lmstudio
    model_id: "openai/local-model"
    max_tokens: 32768

  - name: groq-llama-3.1-8b-instant
    provider: groq
    model_id: "groq/llama-3.1-8b-instant"
    max_tokens: 8192

  - name: cerebras-llama3.1-8b
    provider: cerebras
    model_id: "cerebras/llama3.1-8b"
    max_tokens: 8192

  - name: openrouter-free-router
    provider: openrouter_free
    model_id: "openrouter/openrouter/free"
    max_tokens: 32768

  - name: openrouter-minimax-m2-free
    provider: openrouter_free
    model_id: "openrouter/minimax/minimax-m2:free"
    max_tokens: 100000

  - name: cloudflare-llama-3.2-3b
    provider: cloudflare_workers_ai
    model_id: "cloudflare/@cf/meta/llama-3.2-3b-instruct"
    max_tokens: 8192

  - name: cohere-command-r7b-trial
    provider: cohere_trial
    model_id: "cohere/command-r7b"
    max_tokens: 8192

  - name: mistral-small-experiment
    provider: mistral_experiment
    model_id: "mistral/mistral-small-latest"
    max_tokens: 8192

  - name: github-models-gpt-oss-20b
    provider: github_models_poc
    model_id: "github/openai/gpt-oss-20b"
    max_tokens: 8192

  - name: hf-credits-gpt-oss-20b
    provider: hf_credits
    model_id: "huggingface/openai/gpt-oss-20b"
    max_tokens: 8192

# Slot definitions - assign models to usage slots
# These are exposed to Claude Code via CCR
slots:
  default: gemini-2.5-flash-lite
  bulk: gemini-2.5-flash-lite
  format: gpt-5.4-mini
  think: grok-4.20-beta-reasoning
  background: gemini-2.5-flash-lite
  longContext: grok-4.20-multi-agent-beta
  arbiter: gpt-5.4-pro
  codex: grok-code-fast-1
  opus: gpt-5.4-thinking
  sonnet: grok-4.20-multi-agent-beta
  haiku: gemini-2.5-flash-lite

# Fallback chain for resilience
fallbacks:
  gemini-2.5-flash-lite:
    - gpt-5.4-mini
    - grok-4.20-beta-reasoning
  gemini-2.5-flash:
    - gpt-5.4-mini
    - grok-4.20-beta-reasoning
  gemini-2.5-pro:
    - gpt-5.4-pro
    - grok-4.20-beta-reasoning
  gpt-5.4-pro:
    - grok-4.20-heavy
    - gemini-2.5-pro
  gpt-5.4-thinking:
    - grok-4.20-beta-reasoning
    - gpt-5.4-pro
  gpt-5.4-mini:
    - gemini-2.5-flash-lite
    - grok-4.20-beta-reasoning
  grok-4.20-beta-reasoning:
    - gpt-5.4-thinking
    - gemini-2.5-pro
  grok-4.20-multi-agent-beta:
    - gpt-5.4-pro
    - grok-4.20-heavy
  grok-code-fast-1:
    - gpt-5.4-pro
    - gemini-2.5-flash

# Default fallback list (ordered)
default_fallbacks:
  - gpt-5.4-mini
  - gemini-2.5-flash-lite
  - grok-4.20-beta-reasoning

freeflow:
  enabled: true
  mode: strict_free
  privacy_default: local
  default_sensitivity: non_sensitive
  ledger_path_env: DOPEMUX_FREEFLOW_LEDGER
  timeout_seconds: 90
  max_retries: 1
  slots:
    default: ollama-qwen3-coder
    bulk: gemini-2.5-flash-lite
    format: gemini-2.5-flash-lite
    think: ollama-qwen3-coder
    background: gemini-2.5-flash-lite
    longContext: lmstudio-local
    arbiter: ollama-qwen3-coder
    codex: ollama-qwen3-coder
    opus: ollama-qwen3-coder
    sonnet: ollama-qwen3-coder
    haiku: gemini-2.5-flash-lite
  default_fallbacks:
    - lmstudio-local
    - ollama-qwen3-coder
    - gemini-2.5-flash-lite
    - groq-llama-3.1-8b-instant
    - cerebras-llama3.1-8b
    - openrouter-free-router

# Model alias map for compatibility
# Maps common model names to Dopemux slot names
aliases:
  grok-4: default
  grok: default
  grok-code: codex
  claude-sonnet: sonnet
  claude-sonnet-4-5-20250929: sonnet
  claude-sonnet-4.5: sonnet
  claude-sonnet-4: sonnet
  claude-haiku: haiku
  claude-opus: opus
  claude-opus-4-6: opus
  claude-opus-4-1-20250805: opus
  claude-opus-4-20250514: opus
  claude-opus-4: opus
  claude-4: sonnet
  claude-4-sonnet: sonnet
  claude-4-opus: opus
  claude-3.7: sonnet
  claude-3-7-sonnet-20250219: sonnet
  claude-3.5: sonnet
  claude-3-5-sonnet-20240620: sonnet
  claude-3-5-sonnet-20241022: sonnet
  anthropic/claude-3-5-sonnet-latest: sonnet
  xai/grok-code-fast: codex
  gpt-5: sonnet
  codex: codex
