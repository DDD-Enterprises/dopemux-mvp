# Bundled default MCP catalog used when a project does not define mcp_catalog.yaml.
version: 1

defaults:
  per_worktree:
    - conport
    - dope-memory
    - task-orchestrator

servers:
  pal:
    scope: singleton
    transport: http
    url: "http://localhost:3003/mcp"
    docker_compose_service: pal
    description: "Multi-model reasoning suite (thinkdeep, planner, consensus, debug, codereview)"

  serena:
    scope: singleton
    transport: http
    url: "http://localhost:3006/mcp"
    docker_compose_service: serena
    description: "Semantic code intelligence (LSP + Tree-sitter); workspace auto-detected from cwd"

  dope-context:
    scope: singleton
    transport: http
    url: "http://localhost:3010/mcp"
    docker_compose_service: dope-context
    description: "AST-aware semantic code & docs search; per-call workspace_path"

  desktop-commander:
    scope: singleton
    transport: sse
    url: "http://localhost:3012/sse"
    docker_compose_service: desktop-commander
    description: "Desktop automation (PR #575: pinned fastmcp==2.14.7, Starlette /health)"

  gpt-researcher:
    scope: singleton
    transport: stdio
    command: docker
    args: ["exec", "-i", "dopemux-mcp-gptr-mcp", "python", "/app/server.py"]
    docker_compose_service: gptr-mcp
    requires_env: ["OPENAI_API_KEY"]
    optional_env: ["TAVILY_API_KEY", "EXA_API_KEY", "PERPLEXITY_API_KEY", "ANTHROPIC_API_KEY"]
    description: "Deep multi-source research (PR #575: gpt-researcher==0.14.8 pinned)"

  exa:
    scope: singleton
    transport: stdio
    command: docker
    args: ["exec", "-i", "mcp-litellm", "python", "/app/exa_server.py"]
    docker_compose_service: exa
    requires_env: ["EXA_API_KEY"]
    description: "Neural web search"

  MCP_DOCKER:
    scope: singleton
    transport: stdio
    command: docker
    args: ["mcp", "gateway", "run"]
    description: "Docker MCP gateway - surfaces containerized MCPs from Docker MCP Toolkit"

  conport:
    scope: per-worktree
    transport: sse
    url_template: "http://localhost:${CONPORT_MCP_PORT:-3005}/mcp"
    port_var: CONPORT_MCP_PORT
    default_port_base: 3005
    extra_port_vars:
      - var: CONPORT_HTTP_PORT
        base: 3004
      - var: CONPORT_INFO_PORT
        base: 4004
    docker_compose_service: conport
    requires_env: ["DOPEMUX_WORKSPACE_ID"]
    optional_env: ["GEMINI_API_KEY", "VOYAGEAI_API_KEY", "OPENAI_API_KEY"]
    description: "Knowledge graph, decisions, progress (PostgreSQL+AGE; per-worktree state)"

  dope-memory:
    scope: per-worktree
    transport: sse
    url_template: "http://localhost:${DOPE_MEMORY_PORT:-3020}/mcp"
    port_var: DOPE_MEMORY_PORT
    default_port_base: 3020
    docker_compose_service: dope-memory
    requires_env: ["DOPE_MEMORY_WORKSPACE_ID", "DOPE_MEMORY_INSTANCE_ID"]
    description: "Temporal chronicle and working-context (per worktree instance)"

  task-orchestrator:
    scope: per-worktree
    state_scope: per-repo
    transport: stdio
    command: scripts/mcp-wrappers/task-orchestrator-current-stdio.sh
    args: []
    doctor_args: ["--print-resolution"]
    requires_env: ["TASK_ORCHESTRATOR_PROJECT_ROOT"]
    env_template:
      DOPEMUX_WORKSPACE_ROOT: "${DOPEMUX_WORKSPACE_ROOT:-}"
      DOPEMUX_PROJECT_ROOT: "${DOPEMUX_PROJECT_ROOT:-}"
      TASK_ORCHESTRATOR_PROJECT_ROOT: "${TASK_ORCHESTRATOR_PROJECT_ROOT:-}"
    description: "Current 13-tool MCP Task Orchestrator with repo-scoped SQLite state"
