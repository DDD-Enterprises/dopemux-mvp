# DEPRECATED — this file is NOT the source of truth (ADR-MCPINT-001, 2026-07-17).
#
# The canonical MCP fleet catalog is /mcp_catalog.yaml (schema:
# schemas/mcp/fleet-catalog.schema.json). This legacy registry is retained only
# because live consumers still read it and could not be migrated in
# MCPINT-FND-CATALOG-001's minimal-change scope:
#   - src/dopemux/config/manager.py (ConfigManager default mcp_servers,
#     _repair_legacy_mcp_servers, _generate_server_config)
#   - src/dopemux/mcp/__init__.py re-exports (MCPRegistry et al.)
#   - name-mapping/profile/roles ecosystem keyed on dopemux-* names
#     (claude_config.MCP_NAME_MAPPING, roles/catalog.py, profile_* modules)
#   - tests/test_mcp_registry.py, tests/test_mcp_config_generation.py,
#     tests/arch (validate_legacy_registry_contract)
# Migration/retirement is a follow-up owned by the DMX-MCPINT program.
#
# KNOWN ROT (runtime-refuted claims — do not trust; kept only to avoid changing
# consumer behavior in this packet):
#   - dopemux-zen: ghost server (zen was renamed to PAL; nothing can start this)
#   - dopemux-conport: docker.port 3004 is the HTTP/health port; the live MCP
#     surface is SSE on :3005 (P0 claim 1). Bridge configs generated from this
#     entry target the wrong endpoint.
#
# Do NOT add new servers here. Add them to /mcp_catalog.yaml.

servers:
  dopemux-conport:
    transport: http
    default_enabled: true
    required_for_auto: true
    docker:
      service: conport
      compose_file: compose.yml
      port: 3004
      health_url: http://localhost:3004/health
    local:
      command: uvx
      args:
        - --from
        - context-portal-mcp
        - conport-mcp

  dopemux-serena:
    transport: http
    default_enabled: true
    required_for_auto: true
    docker:
      service: serena
      compose_file: compose.yml
      port: 3006
      health_url: http://localhost:4006/health
    local:
      command: serena
      args:
        - start-mcp-server

  dopemux-desktop-commander:
    transport: http
    default_enabled: false
    required_for_auto: false
    docker:
      service: desktop-commander
      compose_file: compose.yml
      port: 3012
      health_url: http://localhost:3012/health

  dopemux-gpt-researcher:
    transport: http
    default_enabled: false
    required_for_auto: false
    docker:
      service: gptr-mcp
      compose_file: compose.yml
      port: 3009
      health_url: http://localhost:3009/health

  dopemux-leantime-bridge:
    transport: http-sse
    default_enabled: false
    required_for_auto: false
    docker:
      service: leantime-bridge
      compose_file: compose.yml
      port: 3015
      health_url: http://localhost:3015/health

  dopemux-claude-context:
    transport: http
    default_enabled: true
    required_for_auto: true
    docker:
      service: dope-context
      compose_file: compose.yml
      port: 3010
      health_url: http://localhost:3010/health
    local:
      command: npx
      args:
        - -y
        - "@zilliz/claude-context-mcp@latest"

  dope-context:
    transport: http
    default_enabled: false
    required_for_auto: false
    docker:
      service: dope-context
      compose_file: compose.yml
      port: 3010
      health_url: http://localhost:3010/health

  dopemux-pal:
    transport: stdio
    default_enabled: false
    required_for_auto: false
    local:
      command: uvx
      args:
        - pal-mcp-server
        - start
  dopemux-zen:
    transport: stdio
    default_enabled: false
    required_for_auto: false
    local:
      command: npx
      args:
        - -y
        - zen-mcp
