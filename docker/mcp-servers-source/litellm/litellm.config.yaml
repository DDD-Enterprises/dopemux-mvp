model_list:
- model_name: grok-4-fast
  litellm_params:
    model: xai/grok-4-fast
    api_key: os.environ/XAI_API_KEY
    max_tokens: 131072
- model_name: grok-code-fast-1
  litellm_params:
    model: xai/grok-code-fast-1
    api_key: os.environ/XAI_API_KEY
    max_tokens: 131072
# TP-RTX-V5-GROK-DOC-COMPARISON-STEP-0001: comparison lane model
- model_name: grok-4.20-beta
  litellm_params:
    model: xai/grok-4.20-beta
    api_key: os.environ/XAI_API_KEY
    max_tokens: 131072
- model_name: ox-alpha
  litellm_params:
    model: openai/stealth/ox-alpha
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 100000
- model_name: gpt-5.5-pro
  litellm_params:
    model: openai/gpt-5.5-pro
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 100000
- model_name: gpt-5.4-mini
  litellm_params:
    model: openai/gpt-5.4-mini
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 100000
- model_name: glm-4.6
  litellm_params:
    model: openai/glm-4.6
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 128000
- model_name: gpt-5.3-codex
  litellm_params:
    model: openai/gpt-5.3-codex
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 32768
- model_name: gpt-5.4
  litellm_params:
    model: openai/gpt-5.4
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 32768
- model_name: gpt-5-mini
  litellm_params:
    model: openai/gpt-5-mini
    api_key: os.environ/CHEAPERINFERENCE_API_KEY
    api_base: https://api.cheaperinference.com/v1
    max_tokens: 32768
litellm_settings:
  timeout: 120
  max_retries: 3
  drop_params: true
  model_alias_map:
    grok-code: grok-code-fast-1
    grok: grok-4-fast
    minimax: ox-alpha
    codex: gpt-5.3-codex
    claude-sonnet: gpt-5.4
    claude-sonnet-4.5: gpt-5.4
    claude-haiku: gpt-5-mini
    claude-opus: gpt-5.5-pro
    fast: grok-4-fast
    free: ox-alpha
    research: gpt-5.5-pro
    pro: gpt-5.5-pro
    minimax-m2-free: ox-alpha
    o3-deep-research: gpt-5.5-pro
    gpt-5-pro: gpt-5.5-pro
    o3-pro: gpt-5.5-pro
    o3: gpt-5.5-pro
    o4-mini-deep-research: gpt-5.4-mini
    codex-mini: gpt-5.4-mini
    gpt-5-codex: gpt-5.3-codex
    gpt-5: gpt-5.4
router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: false
  allowed_fails: 3
  cooldown_time: 30
  num_retries: 3
  retry_policy:
    TimeoutErrorRetries: 3
    RateLimitErrorRetries: 4
    AuthenticationErrorRetries: 1
    ContentPolicyViolationRetries: 1
  fallbacks:
  - grok-4-fast:
    - gpt-5.4
    - ox-alpha
  - grok-code-fast-1:
    - gpt-5.3-codex
    - gpt-5.4
  - gpt-5.5-pro:
    - gpt-5.4
    - grok-4-fast
  - gpt-5.4-mini:
    - gpt-5.5-pro
    - gpt-5.4
  - gpt-5.4:
    - grok-4-fast
    - ox-alpha
  - gpt-5-mini:
    - ox-alpha
    - grok-4-fast
  - ox-alpha:
    - grok-4-fast
    - gpt-5-mini
general_settings:
  # Must resolve from env — a literal placeholder here makes healthchecks 401
  # (Bearer $LITELLM_MASTER_KEY is treated as a virtual key "not found in db").
  master_key: os.environ/LITELLM_MASTER_KEY
