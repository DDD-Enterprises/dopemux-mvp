# MCP Server Catalog
#
# Registry of MCP servers known to the `dopemux mcp` CLI subcommands.
# Single source of truth for what `dopemux mcp init`, `dopemux mcp add`,
# `dopemux mcp sync-globals`, and `dopemux mcp doctor` understand.
#
# Scope semantics:
#   singleton    — one shared instance, declared in ~/.claude.json `mcpServers`.
#                  Stateless, or routes by per-call workspace_path / cwd auto-detection.
#                  Does NOT need per-worktree isolation.
#   per-worktree — declared in each worktree's .mcp.json. Most entries in this
#                  scope use worktree-isolated ports/volumes; entries may set
#                  state_scope: per-repo when the MCP process is launched from
#                  each worktree but stores one DB per local git repository.
#
# Transport:
#   http     — Streamable HTTP (Claude Code "type": "http")
#   sse      — Server-Sent Events  (Claude Code "type": "sse")
#   stdio    — Local process (Claude Code "type": "stdio") with command + args
#   external — Host-level surface not managed by this repo (managed: false);
#              documented for fleet-map completeness only (ADR-MCPINT-001 §4).
#
# ADR-MCPINT-001 metadata (rendered by MCPINT-FND-CODEGEN-005; data-only here):
#   agents:      per-agent exposure matrix, or the string "none" for infra/PM-sync
#                entries with no agent matrix row. ADR-MCPINT-002 constrains when
#                the generator may honor a row (codex full-sequenced gate).
#   tools:       pointer into the committed mcp_tool_surfaces.json snapshot
#                (snapshot_key + schema_version). Tool names live ONLY there.
#   admin_tools: operator-only tools excluded from workflow docs and non-Claude
#                exposure rows (tool-placement-map §3).
#   workflows:   refs into docs/03-reference/mcp/workflows.yaml (MCPINT-DOC-003);
#                no refs are populated until that file exists.
#
# Env-var conventions for per-worktree servers:
#   DOPEMUX_PORT_<NAME>      — host port allocated by `dopemux mcp init`
#   DOPEMUX_WORKSPACE_ID     — worktree absolute path (used as logical workspace key)
#   DOPEMUX_INSTANCE_ID      — short hash of worktree path (4 hex chars)
#
# `dopemux mcp init` will write these into a per-worktree `.envrc` (or `.env.mcp`)
# and substitute them into `.mcp.json` at session start (Claude Code expands ${VAR}).

version: 1

defaults:
  # What `dopemux mcp init` scaffolds into a fresh worktree's .mcp.json by default.
  # Profile-selected init (`dopemux mcp init --profile`) overrides this list from
  # the named profile (ADR-DMX-MCPPROF-001). Compatibility profile: core-code.
  per_worktree:
    - conport
    - dope-memory
    - task-orchestrator

# Profile-selected tool plane (ADR-DMX-MCPPROF-001). No implicit `all` profile.
# Profiles are exposure projections; they do not change service authority.
profiles:
  core-code:
    description: "Normal implementation and code navigation (GitHub read-only + memory/workflow + Serena)"
    intended_use: "Day-to-day coding agents"
    servers:
      - github-official
      - conport
      - dope-memory
      - task-orchestrator
      - serena
    github:
      read_only: true
      toolsets: [repos, issues, pull_requests, context]
    inventory_baseline:
      visible_tool_count: 51
      rationale: "Seeded GitHub reads (8) + filtered conport/dope-memory/task-orchestrator/serena; writes/admin/shell excluded"

  core-retrieval:
    description: "Broad code/docs retrieval (GitHub read-only + memory/workflow + dope-context)"
    intended_use: "Retrieval-heavy coding without Serena LSP surface"
    servers:
      - github-official
      - conport
      - dope-memory
      - task-orchestrator
      - dope-context
    github:
      read_only: true
      toolsets: [repos, issues, pull_requests, context]
    inventory_baseline:
      visible_tool_count: 42
      rationale: "Seeded GitHub reads + filtered conport/memory/orchestrator/dope-context (index/sync stripped)"

  planning-audit:
    description: "Planning, challenge, and audit (GitHub read-only + dope-context + PAL stdio)"
    intended_use: "Planning/audit sessions; PAL HTTP is never selected"
    servers:
      - github-official
      - dope-context
      - pal-stdio
    github:
      read_only: true
      toolsets: [repos, issues, pull_requests, context]
    inventory_baseline:
      visible_tool_count: 15
      rationale: "GitHub reads + filtered dope-context; pal-stdio snapshot empty until live capture"

  ui-audit:
    description: "Exploratory UI and browser-state investigation (Playwright MCP + optional domain reads)"
    intended_use: "Stateful UI diagnosis only — not routine coding CI"
    servers:
      - github-official
      - playwright-mcp
      - repo-domain-read
    github:
      read_only: true
      toolsets: [repos, issues, pull_requests, context]
    inventory_baseline:
      visible_tool_count: 8
      rationale: "GitHub reads only while Playwright snapshot empty and domain-read blocked without contract"

  research-docs:
    description: "Current library/vendor documentation (Context7)"
    intended_use: "Docs lookup without deep web research"
    servers:
      - github-official
      - context7
    github:
      read_only: true
      toolsets: [repos, context]
    inventory_baseline:
      visible_tool_count: 8
      rationale: "GitHub reads; Context7 tools planned until snapshot"

  research-web:
    description: "Multi-source public research (GPT Researcher)"
    intended_use: "Deep research sessions"
    servers:
      - github-official
      - gpt-researcher
    github:
      read_only: true
      toolsets: [repos, context]
    inventory_baseline:
      visible_tool_count: 8
      rationale: "GitHub reads; GPT Researcher tools planned until snapshot"

  security:
    description: "Security review (GitHub security toolsets + Semgrep)"
    intended_use: "Security review only"
    servers:
      - github-official
      - semgrep
    github:
      read_only: true
      toolsets: [code_security, secret_protection, dependabot, repos]
    inventory_baseline:
      visible_tool_count: 8
      rationale: "GitHub security reads seeded; Semgrep tools planned until snapshot"

  pr-steward:
    description: "PR evidence intake (GitHub PR/review/Actions reads + DCP/facade reads)"
    intended_use: "PR Steward readiness and evidence harvest"
    servers:
      - github-official
      - dcp-readonly-facade
    github:
      read_only: true
      toolsets: [pull_requests, actions, repos, context]
    inventory_baseline:
      visible_tool_count: 8
      rationale: "GitHub PR reads; facade tools planned-active until MCPINT-IMP-FACADE-001"

servers:

  # ---------- Singletons (live in ~/.claude.json) ----------

  pal:
    # Transport truth (P0 claim 11, ADR-MCPINT-001 §4): the pal-http wrapper is a
    # health/lifecycle shim only — /mcp, /sse, /messages all 404. pal-stdio
    # (docker exec) is the sole PAL MCP surface. This entry is quarantined from
    # generated configs until PAL-HTTP-RETROFIT is decided (wire-or-retire).
    # The url below is the health endpoint, kept for doctor/health probing.
    scope: singleton
    transport: http
    plane: reasoning
    authority_role: reasoning-infrastructure
    lifecycle: decision-required
    management_model: compose-service
    identity_scope: singleton
    follow_on_decision: wire-or-retire
    url: "http://localhost:3003/health"
    docker_compose_service: pal
    agents: none
    tools:
      snapshot_key: pal
      schema_version: 1
    description: "PAL http wrapper — health/lifecycle shim only (no MCP endpoint; P0 claim 11). Use pal-stdio for PAL tools. Retrofit decision: PAL-HTTP-RETROFIT."

  serena:
    scope: singleton
    transport: http
    plane: code-intelligence
    authority_role: code-intelligence
    lifecycle: active
    management_model: compose-service
    identity_scope: per-call-workspace
    follow_on_decision: none
    url: "http://localhost:3006/mcp"
    docker_compose_service: serena
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: serena
      schema_version: 1
    description: "Semantic code intelligence (LSP + Tree-sitter); workspace auto-detected from cwd. Write-lane gating owned by DMX-ARCH-SERENA-SURFACE-003."

  dope-context:
    scope: singleton
    transport: http
    plane: retrieval
    authority_role: retrieval-projection
    lifecycle: active
    management_model: compose-service
    identity_scope: per-call-workspace
    follow_on_decision: none
    url: "http://localhost:3010/mcp"
    docker_compose_service: dope-context
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: dope-context
      schema_version: 1
    description: "AST-aware semantic code & docs search; per-call workspace_path"

  desktop-commander:
    scope: singleton
    transport: sse
    plane: automation
    authority_role: desktop-automation
    lifecycle: decision-required
    management_model: compose-service
    identity_scope: host-session
    follow_on_decision: delete-or-host-run
    url: "http://localhost:3012/sse"
    docker_compose_service: desktop-commander
    agents: none
    tools:
      snapshot_key: desktop-commander
      schema_version: 1
    description: "Desktop automation (PR #575: pinned fastmcp==2.14.7, Starlette /health)"

  gpt-researcher:
    scope: singleton
    transport: stdio
    plane: research
    authority_role: deep-research
    lifecycle: active
    management_model: docker-exec
    identity_scope: external-provider
    follow_on_decision: none
    command: docker
    args: ["exec", "-i", "dopemux-mcp-gptr-mcp", "python", "/app/server.py"]
    docker_compose_service: gptr-mcp
    reserved_port: 3009  # gptr-mcp container binds ${GPT_RESEARCHER_PORT:-3009}
    requires_env: ["OPENAI_API_KEY"]
    optional_env: ["TAVILY_API_KEY", "EXA_API_KEY", "PERPLEXITY_API_KEY", "ANTHROPIC_API_KEY"]
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: gpt-researcher
      schema_version: 1
    aux_surfaces:
      # Transport truth (P0 claim 12, GPTR-TRANSPORT-TRUTH): the container also
      # serves an SSE-style /messages endpoint on :3009. It is NOT the
      # contractual agent transport — stdio docker-exec above is.
      - url: "http://localhost:3009/messages"
        protocol: sse
        contractual: false
        note: "Runtime-observed SSE-style endpoint (400 on wrong content-type, not 404); non-contractual per ADR-MCPINT-001 §4."
    description: "Deep multi-source research (PR #575: gpt-researcher==0.14.8 pinned)"

  pal-stdio:
    scope: singleton
    transport: stdio
    plane: reasoning
    authority_role: reasoning-infrastructure
    lifecycle: operator-managed
    management_model: docker-exec
    identity_scope: singleton
    follow_on_decision: none
    command: docker
    args: ["exec", "-i", "mcp-pal-stdio", "/app/.venv/bin/python", "server.py"]
    docker_compose_service: pal-stdio
    requires_env: ["OPENAI_API_KEY", "GEMINI_API_KEY"]
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: pal-stdio
      schema_version: 1
    description: "PAL via Docker MCP (thinkdeep, planner, consensus, debug, codereview, precommit) — the sole PAL MCP surface (P0 claim 11)"

  MCP_DOCKER:
    scope: singleton
    transport: stdio
    plane: gateway
    authority_role: docker-gateway
    lifecycle: operator-managed
    management_model: docker-mcp-gateway
    identity_scope: host-session
    follow_on_decision: none
    command: docker
    args: ["mcp", "gateway", "run"]
    agents:
      claude: full
      codex: none
      opencode: none
      gemini: none
      copilot: none
      chatgpt: none
    tools:
      snapshot_key: MCP_DOCKER
      schema_version: 1
    description: "Docker MCP gateway — surfaces containerized MCPs from Docker MCP Toolkit"

  leantime-bridge:
    # PM-sync plane entry (P0 claim 13: running + healthy, was orphaned from the
    # catalog). No agent matrix row — operator/PM flows only (tool-placement-map §3).
    scope: singleton
    transport: sse
    plane: pm
    authority_role: pm-adapter
    lifecycle: active
    management_model: compose-service
    identity_scope: singleton
    follow_on_decision: none
    url: "http://localhost:3015/sse"
    docker_compose_service: leantime-bridge
    agents: none
    description: "Leantime PM-sync bridge (http-sse; GET /sse + POST /messages/; SVC-LEANTIME-BRIDGE). Not an agent surface."

  dcp-readonly-facade:
    # Universal read plane (ADR-MCPINT-002). Built (services/dcp-readonly-facade,
    # 12 tools — 3 deferred pending the REST→JSON-RPC bridge, DCP-FACADE-DCTX-BRIDGE).
    # planned-active: compose deploy + loopback-bound port land in MCPINT-IMP-FACADE-001;
    # url is added by that packet once a real listener exists.
    scope: singleton
    transport: http
    plane: dcp-read
    authority_role: read-plane-projection
    lifecycle: planned-active
    management_model: compose-service
    identity_scope: per-repo
    follow_on_decision: none
    agents:
      claude: none
      codex: read-plane
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    description: "DCP read-only facade — cross-plane READ projection for non-attributed agents (12 tools, 3 deferred; registry_v2 + route_manifest enforcement per ADR-DCP-MCP-RO-0009). Deployed by MCPINT-IMP-FACADE-001."

  # ---------- Host-level externals (managed: false — documented, not managed) ----------

  mcp-registry:
    scope: singleton
    transport: external
    managed: false
    plane: gateway
    authority_role: connector-discovery
    lifecycle: operator-managed
    management_model: external
    identity_scope: host-session
    follow_on_decision: none
    agents:
      claude: full
      codex: none
      opencode: none
      gemini: none
      copilot: none
      chatgpt: none
    description: "Host-level MCP connector registry (list/search/suggest connectors). Not managed by this repo (PERIPH-MCP-REGISTRY)."

  scheduled-tasks:
    scope: singleton
    transport: external
    managed: false
    plane: automation
    authority_role: task-scheduler
    lifecycle: operator-managed
    management_model: external
    identity_scope: host-session
    follow_on_decision: none
    agents:
      claude: full
      codex: none
      opencode: none
      gemini: none
      copilot: none
      chatgpt: none
    description: "Host-level scheduled-tasks surface; designated scheduler for notifier daily-report + copilot-ingester follow-ups (PERIPH-SCHEDULED-TASKS, tool-placement-map §3)."

  context7:
    scope: singleton
    transport: external
    managed: false
    plane: research
    authority_role: docs-lookup
    lifecycle: operator-managed
    management_model: external
    identity_scope: external-provider
    follow_on_decision: none
    agents:
      claude: full
      codex: none
      opencode: none
      gemini: none
      copilot: none
      chatgpt: none
    tools:
      snapshot_key: context7
      schema_version: 1
    description: "Host-level Context7 official-docs lookup. Not managed by this repo (PERIPH-CONTEXT7)."

  # ---------- Profile-plane specialized surfaces (ADR-DMX-MCPPROF-001) ----------
  # These are not default agent-matrix "all tools" surfaces. Profile selection
  # projects them into task-selected configs. Normal GitHub exposure is read-only.

  github-official:
    # Official GitHub MCP (github/github-mcp-server). Read-only via --read-only /
    # GITHUB_READ_ONLY=1. Toolsets allowlisted per profile (repos/issues/PRs/…).
    # Writes require a later ADR; normal profiles deny write tools in profile_policy.
    scope: singleton
    transport: stdio
    plane: vcs
    authority_role: github-read
    lifecycle: operator-managed
    management_model: operator-managed
    identity_scope: external-provider
    follow_on_decision: none
    command: docker
    args:
      - run
      - -i
      - --rm
      - -e
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - -e
      - GITHUB_READ_ONLY=1
      - ghcr.io/github/github-mcp-server
      - ./github-mcp-server
      - stdio
      - --read-only
    requires_env: ["GITHUB_PERSONAL_ACCESS_TOKEN"]
    # agents: none — not part of agent-matrix full generate (parity). Profile
    # plane (ADR-DMX-MCPPROF-001) is the sole exposure path for this server.
    agents: none
    tools:
      snapshot_key: github-official
      schema_version: 1
    description: "Official GitHub MCP (read-only). Toolsets selected by profile; writes not authorized by ADR-DMX-MCPPROF-001."

  playwright-mcp:
    # Playwright MCP is specialized (ui-audit only). Routine coding/CI uses CLI
    # and committed tests — not this server.
    scope: singleton
    transport: stdio
    plane: automation
    authority_role: browser-inspection
    lifecycle: operator-managed
    management_model: operator-managed
    identity_scope: host-session
    follow_on_decision: none
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
    agents: none
    tools:
      snapshot_key: playwright-mcp
      schema_version: 1
    description: "Playwright MCP for ui-audit only (persistent browser state / a11y tree). Not a posting or production-mutation authority."

  semgrep:
    scope: singleton
    transport: stdio
    plane: security
    authority_role: security-scan
    lifecycle: operator-managed
    management_model: operator-managed
    identity_scope: per-call-workspace
    follow_on_decision: none
    command: semgrep
    args: ["mcp"]
    agents: none
    tools:
      snapshot_key: semgrep
      schema_version: 1
    description: "Semgrep MCP for security profile scans. Not a generic write surface."

  repo-domain-read:
    # Fixed-path local stdio extension. Generator/profile_policy expose only when
    # scripts/mcp/domain-read is a tracked regular file and mcp/domain-read-tools.json
    # validates READ_ONLY_NO_DURABLE_SIDE_EFFECT for every tool.
    scope: singleton
    transport: stdio
    plane: domain-read
    authority_role: domain-read-facade
    lifecycle: operator-managed
    management_model: repo-local
    identity_scope: per-repo
    follow_on_decision: none
    command: "${DOPEMUX_PROJECT_ROOT}/scripts/mcp/domain-read"
    args: []
    agents: none
    tools:
      snapshot_key: repo-domain-read
      schema_version: 1
    description: "Generic fixed-path repo-domain read facade (<repo>/scripts/mcp/domain-read). Blocked when contract fails."

  # ---------- Per-worktree (live in <worktree>/.mcp.json) ----------

  conport:
    scope: per-worktree
    transport: sse
    plane: memory
    authority_role: structured-context-authority
    lifecycle: active
    management_model: compose-service
    identity_scope: per-worktree
    follow_on_decision: none
    # Port var names match compose.yml conventions so `init` writes env that
    # `docker compose up` reads directly.
    url_template: "http://localhost:${CONPORT_MCP_PORT:-3005}/sse"
    port_var: CONPORT_MCP_PORT
    default_port_base: 3005
    extra_port_vars:
      # Conport exposes three host ports (HTTP/health, MCP, info). Per-worktree
      # isolation requires all three to be unique; same hash offset is reused.
      - var: CONPORT_HTTP_PORT
        base: 3004
      - var: CONPORT_INFO_PORT
        base: 4004
    docker_compose_service: conport
    requires_env: ["DOPEMUX_WORKSPACE_ID"]
    optional_env: ["GEMINI_API_KEY", "VOYAGEAI_API_KEY", "OPENAI_API_KEY"]
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: conport
      schema_version: 1
    admin_tools:
      # Operator-only (tool-placement-map §3): excluded from workflow docs and
      # non-Claude exposure rows.
      - fork_instance
      - promote
      - promote_all
    description: "Knowledge graph, decisions, progress (PostgreSQL+AGE; per-worktree state)"

  dope-memory:
    scope: per-worktree
    transport: http
    plane: memory
    authority_role: chronicle-authority
    lifecycle: active
    management_model: compose-service
    identity_scope: per-worktree
    follow_on_decision: none
    url_template: "http://localhost:${DOPE_MEMORY_PORT:-3020}/mcp"
    port_var: DOPE_MEMORY_PORT
    default_port_base: 3020
    docker_compose_service: dope-memory
    requires_env: ["DOPE_MEMORY_WORKSPACE_ID", "DOPE_MEMORY_INSTANCE_ID"]
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: dope-memory
      schema_version: 1
    description: "Temporal chronicle and working-context (per worktree instance)"

  task-orchestrator:
    # Host singleton runtime; declaration may appear in per-repo .mcp.json.
    # Port 7890 is reserved — never project/worktree leased (RUNTIME-006R).
    scope: per-worktree
    state_scope: single_active_project
    transport: http
    plane: workflow
    authority_role: workflow-authority
    lifecycle: active
    management_model: wrapper-singleton
    identity_scope: per-repo
    port_policy: reserved_singleton
    reserved_port: 7890
    follow_on_decision: none
    url_template: "http://127.0.0.1:${TASK_ORCHESTRATOR_HTTP_PORT:-7890}/mcp"
    port_var: TASK_ORCHESTRATOR_HTTP_PORT
    default_port_base: 7890
    doctor_args: ["--print-resolution"]
    requires_env: ["TASK_ORCHESTRATOR_PROJECT_ROOT"]
    env_template:
      DOPEMUX_WORKSPACE_ROOT: "${DOPEMUX_WORKSPACE_ROOT:-}"
      DOPEMUX_PROJECT_ROOT: "${DOPEMUX_PROJECT_ROOT:-}"
      TASK_ORCHESTRATOR_PROJECT_ROOT: "${TASK_ORCHESTRATOR_PROJECT_ROOT:-}"
      TASK_ORCHESTRATOR_HTTP_PORT: "${TASK_ORCHESTRATOR_HTTP_PORT:-7890}"
    agents:
      claude: full
      codex: full-sequenced
      opencode: read-plane
      gemini: read-plane
      copilot: read-plane
      chatgpt: facade
    tools:
      snapshot_key: task-orchestrator
      schema_version: 1
    description: "Host-singleton Task Orchestrator MCP on reserved 7890 (single-active-project state)"
